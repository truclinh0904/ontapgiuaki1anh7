<title>Ôn tập Tiếng Anh 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: mot cot hep (toi da 760px), trang chu la luoi the, de thi la thanh tab I-IX va mot phan lam bai moi lan. */
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --ink:#16263F; --mute:#55657D; --line:#D9E1EC;
  --accent:#16406F; --accent-ink:#FFFFFF; --kite:#E9A524; --ok:#1B7F55; --ok-bg:#E2F4EB; --bad:#C23B2A; --bad-bg:#FBE8E5; --warn-bg:#FFF4DB; --sel:#DCE9F8;
  --head:'Be Vietnam Pro','Segoe UI',Arial,sans-serif; --body:'Nunito','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --card:#172236; --ink:#E7EEF8; --mute:#9FB0C7; --line:#2B3A52; --accent:#7DB2F0; --accent-ink:#0E1626; --kite:#F2BA4B;
  --ok:#5CD39B; --ok-bg:#133726; --bad:#FF8A78; --bad-bg:#3B1B18; --warn-bg:#3A2E10; --sel:#223A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --card:#172236; --ink:#E7EEF8; --mute:#9FB0C7; --line:#2B3A52; --accent:#7DB2F0; --accent-ink:#0E1626; --kite:#F2BA4B;
  --ok:#5CD39B; --ok-bg:#133726; --bad:#FF8A78; --bad-bg:#3B1B18; --warn-bg:#3A2E10; --sel:#223A5C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
#app{max-width:760px;margin-inline:auto}
h1,h2,h3,h4{font-family:var(--head);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.15rem;font-weight:600;margin-block:28px 12px} h3{font-size:1.02rem;font-weight:600}
p{margin:0 0 .6em}
a{color:var(--accent)}
.top{margin-bottom:8px}
.brand{font-family:var(--head);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sub{color:var(--mute);margin-top:6px}
.back{display:inline-block;margin-bottom:14px;font-weight:600;text-decoration:none}
.back::before{content:"\2190  "}
.who{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px 14px;margin-top:20px}
.who h2{margin-top:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row label{flex:1 1 200px;min-width:0;font-size:.85rem;font-weight:600;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:.85rem;color:var(--mute);margin:10px 0 0}
.grid,.grid3{display:grid;gap:12px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card b{font-family:var(--head);font-size:1.05rem}
.card span{font-size:.85rem;color:var(--mute)}
.card .mini{color:var(--accent);font-weight:700}
.gcard{border-top:4px solid var(--kite)}
.gl{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gc h3{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ic{flex:none;color:var(--accent)}
.gc p{font-size:.96rem}
.tip{background:var(--warn-bg);border-radius:8px;padding:8px 10px;margin-top:10px}
.tb{border-collapse:collapse;width:100%;font-size:.92rem;display:block;overflow-x:auto}
.tb td{border:1px solid var(--line);padding:5px 9px}
.pn{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pn a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-weight:600;font-size:.9rem}
.pn a.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{flex:none;min-width:44px;height:40px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 .95rem var(--head);cursor:pointer}
.tab.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.done::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}
.tab.cur.done::after{background:var(--kite)}
.act{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ah{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.instr{font-size:.88rem;color:var(--mute);font-style:italic;margin-top:4px}
.stars{display:flex;gap:2px}
.st{color:var(--line)} .st.on{color:var(--kite)} .st .ic{color:inherit;fill:currentColor}
.box{list-style:none;padding:10px 12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg);border:1px dashed var(--mute);border-radius:8px}
.box li{font-weight:700;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.ql{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:14px}
.q{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:start}
.no{font-family:var(--head);font-weight:700;color:var(--accent)}
.qs{margin:0 0 6px;overflow-wrap:anywhere}
.hint{margin:0 0 4px;padding:4px 9px;border-left:3px solid var(--ok);background:var(--ok-bg);border-radius:0 6px 6px 0;font-size:.92rem;overflow-wrap:anywhere}
.hl{margin:10px 0 4px;font-weight:700}
.hints{margin:0 0 10px;padding-left:0;list-style:none;display:grid;gap:4px}
.hints li{padding:4px 9px;border-left:3px solid var(--ok);background:var(--ok-bg);border-radius:0 6px 6px 0;font-size:.92rem}
.stub{font-size:.88rem;color:var(--mute);margin:0 0 6px}
.un{font-size:.72rem;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap}
.unrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bk{display:inline-block;width:3.2em;border-bottom:2px solid var(--mute);margin-inline:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{display:flex;gap:8px;align-items:baseline;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt b{color:var(--accent)}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.q.ok .opt.sel{background:var(--ok-bg);border-color:var(--ok)}
.q.bad .opt.sel{background:var(--bad-bg);border-color:var(--bad)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);opacity:.7}
.opt.no span{text-decoration:line-through}
.qfb{margin:6px 0 0;padding:6px 10px;border-radius:0 6px 6px 0;font-size:.92rem;overflow-wrap:anywhere}
.qfb.no{background:var(--bad-bg);border-left:3px solid var(--bad);font-weight:400;color:var(--ink,inherit)}
.qfb.ok{background:var(--ok-bg);border-left:3px solid var(--ok);font-weight:600}
.btn.sm{padding:5px 12px;font-size:.88rem;margin-top:6px}
.q.now{box-shadow:0 0 0 2px var(--kite);border-radius:8px}
.opts.long{grid-template-columns:1fr}
.opt.key{background:var(--ok-bg);border-color:var(--ok)}
.opt.key b{color:var(--ok)}
.ans{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:.92rem}
.ty + .ans{display:block;margin:6px 0 0;width:fit-content}
.more{margin-top:4px}
.more summary{cursor:pointer;color:var(--accent);font-weight:600}
.more p{margin:6px 0 0}
.fb.stop{background:var(--warn-bg)}
.rule{font-size:.85rem;color:var(--mute);margin:12px 0 0}
.gp{width:9.5em;max-width:100%;display:inline-block;padding:4px 8px}
.ty{width:100%;resize:vertical}
input.ok,textarea.ok,select.ok{border-color:var(--ok);background:var(--ok-bg)}
input.bad,textarea.bad,select.bad{border-color:var(--bad);background:var(--bad-bg)}
.pass{margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:8px;line-height:2.2}
.pass h4{font-size:1rem;margin-bottom:6px}
.pass p{margin:0}
.pb{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pb i{font-style:normal;font-size:.75rem;font-weight:700;color:var(--accent)}
.sl{padding:4px 6px;max-width:100%}
.fb{margin-top:16px;border-radius:8px;padding:10px 14px}
.fb p{margin:0 0 6px}
.fb.warn{background:var(--warn-bg)} .fb.good{background:var(--ok-bg)}
.how{font-size:.94rem}
.bt{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{font:600 .95rem var(--head);padding:10px 18px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lnk{font-weight:700}
@media (max-width:520px){h1{font-size:1.55rem}.q{grid-template-columns:26px minmax(0,1fr)}.q .un{grid-column:2;justify-self:start}}
@media (prefers-reduced-motion:no-preference){.card,.btn,.tab{transition:border-color .15s,background .15s}}
</style>

<script>window.DES = [{"id": "g7d21", "no": 21, "title": "Đề số 21", "acts": [{"id": "d21-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["open<u>ed</u>", "danc<u>ed</u>", "plann<u>ed</u>", "show<u>ed</u>"], "a": 1, "u": 1, "hint": "Đuôi -ed đọc /t/ sau âm vô thanh (như /k/, /s/, /f/, /ʃ/, /p/), đọc /id/ sau âm /t/ và /d/, còn lại đọc /d/. Hãy đọc thầm động từ gốc rồi xét âm cuối."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["brush<u>es</u>", "chang<u>es</u>", "dog<u>s</u>", "watch<u>es</u>"], "a": 2, "u": 1, "hint": "Đuôi -s/-es đọc /s/ sau âm vô thanh (/p/, /t/, /k/, /f/), đọc /iz/ sau âm gió (/s/, /z/, /ʃ/, /tʃ/, /dʒ/), còn lại đọc /z/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["g<u>ir</u>l", "th<u>ir</u>d", "doct<u>or</u>", "n<u>ur</u>se"], "a": 2, "u": 1, "hint": "So sánh âm /ɜː/ (như trong 'bird', 'nurse') và âm /ə/ (âm yếu, ngắn như ở cuối 'teacher', đầu 'about'). Đọc chậm từng từ rồi nghe âm gạch chân."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>f</u>riend", "li<u>v</u>e", "<u>f</u>ind", "enou<u>gh</u>"], "a": 1, "u": 1, "hint": "So sánh /f/ và /v/: f, ph và gh (trong laugh, enough, tough) đọc /f/; v đọc /v/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>th</u>ese", "toge<u>th</u>er", "mo<u>th</u>er", "<u>th</u>ank"], "a": 3, "u": 1, "hint": "So sánh /θ/ (thank, think, three, both, month, birthday) và /ð/ (this, these, they, mother, father, weather, together). Đặt lưỡi giữa răng, thử xem dây thanh quản có rung không."}]}, {"id": "d21-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "My brother adores ___ models of old ships.", "o": ["made", "making", "make", "makes"], "a": 1, "u": 1, "hint": "Sau động từ chỉ sở thích (adore, love, like...), động từ theo sau ở dạng nào? Xét nghĩa: 'làm mô hình'."}, {"s": "Mai goes ___ every weekend to keep fit.", "o": ["jog", "jogging", "jogged", "jogs"], "a": 1, "u": 2, "hint": "Cấu trúc go + V-ing dùng cho các hoạt động thể thao, giải trí."}, {"s": "We should wear a hat to avoid ___ in summer.", "o": ["acne", "sunburn", "lip balm", "a cough"], "a": 1, "u": 2, "hint": "Cần danh từ chỉ hậu quả của việc đi nắng mà không đội mũ: da bị cháy nắng."}, {"s": "The volunteers often ___ old clothes to poor children.", "o": ["water", "tutor", "plant", "donate"], "a": 3, "u": 3, "hint": "Chọn động từ nghĩa là 'quyên góp, tặng' (quần áo cũ cho trẻ em nghèo)."}, {"s": "Nam is keen ___ collecting stamps.", "o": ["of", "on", "at", "in"], "a": 1, "u": 1, "hint": "Cụm cố định: keen + giới từ + V-ing (thích, đam mê). Nhớ giới từ đi với keen."}, {"s": "How ___ do you go swimming? – Twice a week.", "o": ["often", "much", "far", "long"], "a": 0, "u": 1, "hint": "Câu trả lời 'Twice a week' (hai lần một tuần) cho biết câu hỏi về tần suất."}, {"s": "If you eat too much sugar, you ___ toothache.", "o": ["got", "will get", "getting", "gets"], "a": 1, "u": 2, "hint": "Câu điều kiện loại 1: If + hiện tại đơn, mệnh đề chính dùng thì tương lai đơn."}, {"s": "My sister ___ cartoons on TV last night.", "o": ["watch", "watching", "watches", "watched"], "a": 3, "u": 1, "hint": "Có 'last night' (tối qua): dùng thì quá khứ đơn, động từ thêm -ed."}, {"s": "– “Would you like to join the Green Club?” – “___”", "o": ["It's my pleasure.", "Yes, I like.", "Yes, I'd love to.", "No, I don't mind."], "a": 2, "u": 3, "hint": "Đây là lời mời 'Would you like to...?'. Chọn câu đáp nhận lời một cách lịch sự và đúng ngữ pháp."}, {"s": "Find the mistake: Hoa <u>enjoy</u> <u>listening</u> to <u>music</u> in her <u>free time</u>.", "o": ["enjoy", "listening", "music", "free time"], "a": 0, "u": 1, "hint": "Chủ ngữ Hoa là số ít ngôi thứ ba, thì hiện tại đơn: xem động từ đã chia đúng chưa."}]}, {"id": "d21-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "My father (drive) ___ to work every day.", "a": 0, "u": 1, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật), dấu hiệu 'every'. Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["drives", "drive", "driving"], "c3": 1}, {"s": "I (go) ___ fishing with my uncle last Sunday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["went", "go", "goes"], "c3": 1}, {"s": "My sister loves (paint) ___ pictures.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["painting", "paint", "paints"], "c3": 1}, {"s": "Look! The children (play) ___ in the yard.", "a": 0, "u": 1, "hint": "Dấu hiệu 'Look!' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["are playing", "play", "played"], "c3": 1}, {"s": "The weather (be) ___ cold last week.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["was", "were", "is"], "c3": 1}, {"s": "My brother (not like) ___ fast food.", "a": 0, "u": 2, "hint": "Chủ ngữ số ít, hiện tại đơn phủ định: dùng does not + động từ nguyên mẫu.", "o": ["does not like", "do not like", "does not likes"], "c3": 1}, {"s": "You should (drink) ___ more water.", "a": 0, "u": 2, "hint": "Sau should/shouldn't dùng động từ nguyên mẫu không có to.", "o": ["drink", "to drink", "drinking"], "c3": 1}]}, {"id": "d21-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "Lan adores ___ dollhouses from cardboard.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'xây, làm (mô hình)'.", "o": ["building", "build", "built"], "c3": 1}, {"s": "My uncle loves ___ old coins from many countries.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'sưu tầm'.", "o": ["collecting", "collect", "collected"], "c3": 1}, {"s": "Mai doesn't like ___ judo because it is too hard.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'làm, tập'.", "o": ["doing", "do", "did"], "c3": 1}, {"s": "Do you fancy ___ chess with me after school?", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'chơi'.", "o": ["playing", "play", "played"], "c3": 1}, {"s": "Tom enjoys ___ cycling along the river on Sundays.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'đi'.", "o": ["going", "go", "went"], "c3": 1}, {"s": "My brother hates ___ a horse; he is afraid of it.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'cưỡi, đi (ngựa, xe)'.", "o": ["riding", "ride", "rode"], "c3": 1}, {"s": "She detests ___ comic books; she prefers films.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'đọc'.", "o": ["reading", "read", "reads"], "c3": 1}, {"s": "My mother loves ___ meals for the whole family.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'nấu ăn'.", "o": ["cooking", "cook", "cooked"], "c3": 1}, {"s": "Grandpa likes ___ the vegetables in the garden every morning.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'tưới (cây)'.", "o": ["watering", "water", "watered"], "c3": 1}, {"s": "Linh dislikes ___ a cake for the party; it is hard.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'làm, chế tạo'.", "o": ["making", "make", "made"], "c3": 1}], "box": ["cooking", "building", "going", "collecting", "playing", "making", "riding", "watering", "reading", "doing"]}, {"id": "d21-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "Who gave Minh his first plane kit?", "o": ["His teacher", "His uncle", "A friend", "His father"], "a": 1, "u": 1, "hint": "Tìm câu có 'plane kit' và 'gave' trong đoạn văn; xem ai là người tặng."}, {"s": "How long does Minh spend on his hobby every Sunday?", "o": ["All day", "About three hours", "Half an hour", "About two hours"], "a": 1, "u": 1, "hint": "Tìm cụm 'every Sunday' ở câu về thời gian dành cho mô hình."}, {"s": "Where does Minh keep his models?", "o": ["In the garden", "In a box at school", "On a shelf in his room", "In the club"], "a": 2, "u": 1, "hint": "Tìm câu có động từ 'keeps' để biết nơi cất mô hình."}, {"s": "What can we infer from the passage?", "o": ["Minh has no friends.", "Minh's uncle is a model maker.", "Minh dislikes his hobby.", "Minh enjoys his hobby and shares it with others."], "a": 3, "u": 1, "hint": "Câu hỏi suy luận: xem Minh làm gì với sở thích và kết quả (kết bạn ở câu lạc bộ), chọn ý khái quát đúng."}], "passage": "Minh is thirteen years old. His hobby is making model planes. He started it two years ago, when his uncle gave him a small plane kit. Now he spends about three hours every Sunday on his models. He keeps them on a big shelf in his room. Last month, he joined the school model club, and he made many new friends there.", "ptitle": "Minh's Hobby"}, {"id": "d21-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["sweets", "salt", "chips", "vegetables"], "a": 3, "u": 2, "hint": "Sau 'a lot of' và trước 'and fruit', cần một thứ ăn nhiều để khoẻ."}, {"o": ["sick", "fat", "healthy", "hungry"], "a": 2, "u": 2, "hint": "'keep you ___': chọn tính từ chỉ tình trạng cơ thể tốt."}, {"o": ["cola", "sugar", "water", "coffee"], "a": 2, "u": 2, "hint": "Nên uống đủ gì? Đối lập với nước ngọt (soft drinks)."}, {"o": ["cook", "skip", "eat", "have"], "a": 1, "u": 2, "hint": "'Do not ___ breakfast': nghĩa là bỏ bữa. Chọn động từ nghĩa 'bỏ qua'."}], "passage": "Eating well is important for teenagers. You should eat a lot of {1} and fruit every day. They give you vitamins and keep you {2} . You should drink enough {3} and avoid soft drinks. Do not {4} breakfast, because it gives you energy for the morning."}, {"id": "d21-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "He likes reading comic books.", "a": 0, "u": 1, "hint": "Dùng be + tính từ + giới từ + V-ing để diễn đạt sở thích (fond of / keen on / interested in / crazy about). Chọn cụm cùng nghĩa 'thích', rồi giữ nguyên phần V-ing.", "o": ["He is fond of reading comic books.", "He is fond of read comic books.", "He are fond of reading comic books."], "c3": 1}, {"s": "He is clever. He is active.", "a": 0, "u": 2, "hint": "Nối hai tính từ bằng and, chỉ dùng một chủ ngữ và một động từ be.", "o": ["He is clever and active.", "He are clever and active.", "He is clever or active."], "c3": 1}, {"s": "She took an aspirin because she wanted to stop her toothache.", "a": 0, "u": 2, "hint": "Rút gọn 'because ... wanted to + V' thành mục đích: to + động từ nguyên mẫu, bỏ chủ ngữ và 'wanted'.", "o": ["She took an aspirin to stop her toothache.", "She took an aspirin to stopping her toothache.", "She took an aspirin stop her toothache."], "c3": 1}, {"s": "Nam wrote an essay in class this morning.", "a": 0, "u": 3, "hint": "Chuyển câu khẳng định quá khứ thành phủ định: did not + động từ nguyên mẫu (động từ chính trở về dạng gốc).", "o": ["Nam did not write an essay in class this morning.", "Nam did not wrote an essay in class this morning.", "Nam did not write an essay on class this morning."], "c3": 1}, {"s": "Hoa likes painting best.", "a": 0, "u": 1, "hint": "Dùng cấu trúc: Tên người's favourite hobby is + V-ing (sở thích yêu thích nhất).", "o": ["Hoa's favourite hobby is painting.", "Hoa's favourite hobby are painting.", "Hoa's favourite hobby painting."], "c3": 1}]}, {"id": "d21-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "drinks / my brother / never / soft drinks", "a": 0, "u": 1, "hint": "Trạng từ tần suất (never, often, always...) đứng trước động từ thường; thứ tự: S + trạng từ + V + O. Câu bắt đầu bằng: My.", "o": ["My brother never drinks soft drinks.", "My brother drinks never soft drinks.", "My brother never soft drinks drinks."], "c3": 1}, {"s": "likes / in the evening / dancing / she", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: She.", "o": ["She likes dancing in the evening.", "She dancing likes in the evening.", "Likes she dancing in the evening."], "c3": 1}, {"s": "jogging / in the park / every morning / we / go", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: We.", "o": ["We go jogging in the park every morning.", "We jogging go in the park every morning.", "Go we jogging in the park every morning."], "c3": 1}, {"s": "is / collecting stamps / Lan / keen on", "a": 0, "u": 1, "hint": "Cấu trúc: S + be + tính từ + giới từ + V-ing. Câu bắt đầu bằng: Lan.", "o": ["Lan is keen on collecting stamps.", "Lan keen on is collecting stamps.", "Lan is collecting stamps keen on."], "c3": 1}, {"s": "doesn't like / fast food / eating / my father", "a": 0, "u": 1, "hint": "Cấu trúc phủ định: S + doesn't/didn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: My.", "o": ["My father doesn't like eating fast food.", "My father eating doesn't like fast food.", "My father doesn't like fast food eating."], "c3": 1}]}]}, {"id": "g7d22", "no": 22, "title": "Đề số 22", "acts": [{"id": "d22-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["brush<u>es</u>", "cook<u>s</u>", "laugh<u>s</u>", "coat<u>s</u>"], "a": 0, "u": 1, "hint": "Đuôi -s/-es đọc /s/ sau âm vô thanh (/p/, /t/, /k/, /f/), đọc /iz/ sau âm gió (/s/, /z/, /ʃ/, /tʃ/, /dʒ/), còn lại đọc /z/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>ir</u>st", "n<u>ur</u>se", "fam<u>ou</u>s", "w<u>or</u>d"], "a": 2, "u": 1, "hint": "So sánh âm /ɜː/ (như trong 'bird', 'nurse') và âm /ə/ (âm yếu, ngắn như ở cuối 'teacher', đầu 'about'). Đọc chậm từng từ rồi nghe âm gạch chân."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["tou<u>gh</u>", "<u>f</u>riend", "gi<u>v</u>e", "<u>f</u>ind"], "a": 2, "u": 1, "hint": "So sánh /f/ và /v/: f, ph và gh (trong laugh, enough, tough) đọc /f/; v đọc /v/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["toge<u>th</u>er", "<u>th</u>en", "wea<u>th</u>er", "<u>th</u>irsty"], "a": 3, "u": 1, "hint": "So sánh /θ/ (thank, think, three, both, month, birthday) và /ð/ (this, these, they, mother, father, weather, together). Đặt lưỡi giữa răng, thử xem dây thanh quản có rung không."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>s</u>ong", "wa<u>sh</u>", "<u>sh</u>e", "<u>sh</u>ow"], "a": 0, "u": 1, "hint": "So sánh /s/ (see, song, six) và /ʃ/ (she, show, shop, fish, wash). Chữ sh luôn đọc /ʃ/."}]}, {"id": "d22-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "My sister is a vegetarian. She doesn't eat ___ .", "o": ["fruit", "tofu", "meat", "vegetables"], "a": 2, "u": 2, "hint": "Người ăn chay không ăn một loại thực phẩm nhất định: chọn loại mà người ăn chay tránh."}, {"s": "Doing morning exercise is good ___ your health.", "o": ["to", "for", "at", "on"], "a": 1, "u": 2, "hint": "Cụm tính từ: good + giới từ + your health (tốt cho sức khoẻ). Nhớ giới từ đi với good khi chỉ đối tượng được lợi."}, {"s": "Last Sunday, my class ___ the school yard.", "o": ["clean", "cleans", "cleaning", "cleaned"], "a": 3, "u": 3, "hint": "Có 'Last Sunday': thì quá khứ đơn. Hành động: dọn sạch sân trường."}, {"s": "Mary ___ English at 7 a.m. every day.", "o": ["studies", "study", "studied", "studying"], "a": 0, "u": 1, "hint": "'Every day' + chủ ngữ Mary (số ít): thì hiện tại đơn, chú ý động từ tận cùng -y."}, {"s": "You shouldn't ___ up late at night.", "o": ["staying", "to stay", "stays", "stay"], "a": 3, "u": 2, "hint": "Sau 'shouldn't' dùng động từ ở dạng nào? Cụm 'stay up late': thức khuya."}, {"s": "Many teenagers have ___ , so they should wash their faces carefully.", "o": ["backache", "sunburn", "a flu", "acne"], "a": 3, "u": 2, "hint": "Vấn đề về da của tuổi teen, phải rửa mặt kỹ: các nốt mụn."}, {"s": "___ do you go to the library? – By bike.", "o": ["How", "How often", "How long", "How far"], "a": 0, "u": 1, "hint": "Câu trả lời 'By bike' (bằng xe đạp) cho biết câu hỏi về phương tiện/cách thức."}, {"s": "Lan is fond ___ drawing pictures of animals.", "o": ["at", "of", "on", "in"], "a": 1, "u": 1, "hint": "Cụm cố định: fond + giới từ + V-ing (thích). Nhớ giới từ đi với fond."}, {"s": "– “What should I do to keep fit?” – “___”", "o": ["You are welcome.", "I'm fine, thanks.", "It's my hobby.", "You should do exercise regularly."], "a": 3, "u": 2, "hint": "Câu hỏi xin lời khuyên 'What should I do...?'. Chọn câu đáp đưa ra lời khuyên."}, {"s": "Find the mistake: My mother <u>doesn't</u> <u>likes</u> <u>eating</u> fast <u>food</u>.", "o": ["doesn't", "likes", "eating", "food"], "a": 1, "u": 2, "hint": "Sau 'doesn't' động từ thường ở dạng nguyên mẫu, không thêm -s."}]}, {"id": "d22-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "The sun (set) ___ in the west.", "a": 0, "u": 1, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật). Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["sets", "set", "setting"], "c3": 1}, {"s": "We (visit) ___ the nursing home two days ago.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('ago'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["visited", "visit", "visits"], "c3": 1}, {"s": "Do you like (cook) ___ with your mother?", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["cooking", "cook", "cooks"], "c3": 1}, {"s": "My mother (cook) ___ dinner now.", "a": 0, "u": 1, "hint": "Dấu hiệu 'now' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["is cooking", "cooks", "cooked"], "c3": 1}, {"s": "We (be) ___ at the library yesterday morning.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["were", "was", "are"], "c3": 1}, {"s": "We (not go) ___ to school last Sunday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): phủ định quá khứ đơn dùng did not + động từ nguyên mẫu.", "o": ["did not go", "did not went", "does not go"], "c3": 1}, {"s": "If you (wear) ___ a hat, you will avoid sunburn.", "a": 0, "u": 2, "hint": "Mệnh đề If trong câu điều kiện loại 1 dùng thì hiện tại đơn (không dùng will); chủ ngữ you/it xác định dạng động từ.", "o": ["wear", "will wear", "wore"], "c3": 1}]}, {"id": "d22-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "Eating too much sugar can ___ your teeth.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'ảnh hưởng, làm hại' phù hợp với chỗ trống.", "o": ["affect", "weight", "energy"], "c3": 1}, {"s": "You should ___ soft drinks.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'tránh' phù hợp với chỗ trống.", "o": ["avoid", "weight", "healthy"], "c3": 1}, {"s": "Don't ___ breakfast; it is the most important meal.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'bỏ (bữa)' phù hợp với chỗ trống.", "o": ["skip", "junk", "weight"], "c3": 1}, {"s": "Apples and oranges are ___ snacks.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'lành mạnh' phù hợp với chỗ trống.", "o": ["healthy", "weight", "affect"], "c3": 1}, {"s": "Breakfast gives you ___ for the morning.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'năng lượng' phù hợp với chỗ trống.", "o": ["energy", "fresh", "skip"], "c3": 1}, {"s": "Burgers and chips are ___ food.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'tính từ: rác rưởi (food: đồ ăn vặt kém dinh dưỡng)' phù hợp với chỗ trống.", "o": ["junk", "weight", "avoid"], "c3": 1}, {"s": "You should get eight hours of ___ every night.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'giấc ngủ' phù hợp với chỗ trống.", "o": ["sleep", "fresh", "healthy"], "c3": 1}, {"s": "We ___ every morning in the park.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'tập thể dục' phù hợp với chỗ trống.", "o": ["exercise", "junk", "healthy"], "c3": 1}, {"s": "These vegetables are ___ from my garden.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'tươi' phù hợp với chỗ trống.", "o": ["fresh", "skip", "affect"], "c3": 1}, {"s": "Too much fast food makes you put on ___ .", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'cân nặng' phù hợp với chỗ trống.", "o": ["weight", "avoid", "exercise"], "c3": 1}], "box": ["junk", "sleep", "weight", "exercise", "avoid", "fresh", "energy", "affect", "healthy", "skip"]}, {"id": "d22-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "What does Lan do after she gets up?", "o": ["She goes to school.", "She does morning exercise.", "She cooks lunch.", "She watches TV."], "a": 1, "u": 1, "hint": "Đọc câu thứ hai của đoạn văn: Lan làm gì ngay sau khi dậy."}, {"s": "What does she have for breakfast?", "o": ["Noodles", "Soft drinks", "Rice and fish", "Bread, eggs and milk"], "a": 3, "u": 1, "hint": "Tìm câu bắt đầu bằng 'For breakfast'."}, {"s": "Why doesn't Lan drink soft drinks?", "o": ["She doesn't like water.", "They are bad for her health.", "They are expensive.", "Her mother says no."], "a": 1, "u": 1, "hint": "Tìm câu có 'never drinks soft drinks' và từ 'because' để thấy lý do."}, {"s": "What can we infer about Lan?", "o": ["She is always tired.", "She dislikes sports.", "She has healthy habits.", "She eats a lot of fast food."], "a": 2, "u": 1, "hint": "Câu suy luận: nhìn thói quen của Lan (tập thể dục, ăn uống, đi ngủ) để kết luận chung."}], "passage": "Lan is a healthy girl. She gets up at six and does morning exercise in the yard. For breakfast, she has bread and eggs with a glass of milk. At school, she brings a lunch box with rice, fish and vegetables. She never drinks soft drinks because she thinks they are bad for her health. She usually goes to bed at ten.", "ptitle": "A Healthy Day"}, {"id": "d22-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["rain", "sun", "wind", "dark"], "a": 1, "u": 2, "hint": "'spend too much time in the ___': dưới ánh nắng nên bị cháy nắng."}, {"o": ["oil", "soap", "lip balm", "suncream"], "a": 3, "u": 2, "hint": "Cùng với đội mũ, còn nên bôi gì lên da để chống nắng?"}, {"o": ["heat", "sun", "light", "shade"], "a": 3, "u": 2, "hint": "Nên ở chỗ nào vào buổi trưa để tránh nắng gắt?"}, {"o": ["much", "every", "other", "any"], "a": 1, "u": 2, "hint": "'drink a lot of water ___ day': cần từ chỉ 'mỗi ngày'."}], "passage": "Sunburn is a common problem in summer. If you spend too much time in the {1} , you will get sunburn. You should wear a hat and put on some {2} before you go out. It is also a good idea to stay in the {3} at noon. Remember to drink a lot of water {4} day."}, {"id": "d22-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "It is bad for your heart if you eat too much meat.", "a": 0, "u": 2, "hint": "Dùng V-ing làm chủ ngữ: V-ing + ... + is + tính từ, thay cho cấu trúc 'It is + tính từ + to V'.", "o": ["Eating too much meat is bad for your heart.", "Eating too much meat are bad for your heart.", "Eating too much meat is bad to your heart."], "c3": 1}, {"s": "Doing exercise every day is a good idea.", "a": 0, "u": 2, "hint": "Dùng should (nên) hoặc shouldn't (không nên) + động từ nguyên mẫu để nói lời khuyên, thay cho 'It is a (not) good idea / not healthy'.", "o": ["You should do exercise every day.", "You should to do exercise every day.", "You should doing exercise every day."], "c3": 1}, {"s": "I find dancing interesting.", "a": 0, "u": 1, "hint": "Chuyển 'find + V-ing + tính từ' thành 'think that + V-ing + is + tính từ'. Chú ý chủ ngữ số ít nên dùng is.", "o": ["I think that dancing is interesting.", "I think that dancing are interesting.", "I think that dancing interesting."], "c3": 1}, {"s": "Mai is a nurse. Linh is a nurse.", "a": 0, "u": 2, "hint": "Cấu trúc Both A and B + động từ số nhiều; danh từ cuối câu để ở số nhiều.", "o": ["Both Mai and Linh are nurses.", "Both Mai and Linh is nurses.", "Both Mai or Linh are nurses."], "c3": 1}, {"s": "Regular exercise keeps you fit.", "a": 0, "u": 2, "hint": "Dùng câu điều kiện loại 1: If + hiện tại đơn, S + will + V. Nếu câu gốc có 'must ... or' thì mệnh đề If ở dạng phủ định.", "o": ["If you do exercise regularly, you will keep fit.", "If you do exercise regularly, you will keeps fit.", "If you will do exercise regularly, you will keep fit."], "c3": 1}]}, {"id": "d22-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "vegetables / good for your health / is / eating", "a": 0, "u": 1, "hint": "Câu bắt đầu bằng V-ing làm chủ ngữ + is + cụm tính từ. Câu bắt đầu bằng: Eating.", "o": ["Eating vegetables is good for your health.", "Eating is vegetables good for your health.", "Vegetables eating is good for your health."], "c3": 1}, {"s": "rice and fish / cooks / my mother / often", "a": 0, "u": 1, "hint": "Trạng từ tần suất (never, often, always...) đứng trước động từ thường; thứ tự: S + trạng từ + V + O. Câu bắt đầu bằng: My.", "o": ["My mother often cooks rice and fish.", "My mother cooks often rice and fish.", "My mother often rice and fish cooks."], "c3": 1}, {"s": "more water / should / you / drink", "a": 0, "u": 1, "hint": "Cấu trúc: S + should/shouldn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: You.", "o": ["You should drink more water.", "You drink should more water.", "You should more water drink."], "c3": 1}, {"s": "doesn't / eat / Tom / much fast food", "a": 0, "u": 1, "hint": "Cấu trúc phủ định: S + doesn't/didn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: Tom.", "o": ["Tom doesn't eat much fast food.", "Tom eat doesn't much fast food.", "Tom doesn't much fast food eat."], "c3": 1}, {"s": "your eyes / good for / are / carrots", "a": 0, "u": 1, "hint": "Cấu trúc: S + be + cụm tính từ/giới từ + tân ngữ. Câu bắt đầu bằng: Carrots.", "o": ["Carrots are good for your eyes.", "Carrots good for are your eyes.", "Carrots are your eyes good for."], "c3": 1}]}]}, {"id": "g7d23", "no": 23, "title": "Đề số 23", "acts": [{"id": "d23-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["th<u>ir</u>d", "n<u>ur</u>se", "h<u>ur</u>t", "doct<u>or</u>"], "a": 3, "u": 1, "hint": "So sánh âm /ɜː/ (như trong 'bird', 'nurse') và âm /ə/ (âm yếu, ngắn như ở cuối 'teacher', đầu 'about'). Đọc chậm từng từ rồi nghe âm gạch chân."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>v</u>ery", "<u>f</u>ood", "ha<u>v</u>e", "<u>v</u>ase"], "a": 1, "u": 1, "hint": "So sánh /f/ và /v/: f, ph và gh (trong laugh, enough, tough) đọc /f/; v đọc /v/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["fa<u>th</u>er", "<u>th</u>ink", "bo<u>th</u>", "bir<u>th</u>day"], "a": 0, "u": 1, "hint": "So sánh /θ/ (thank, think, three, both, month, birthday) và /ð/ (this, these, they, mother, father, weather, together). Đặt lưỡi giữa răng, thử xem dây thanh quản có rung không."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>s</u>tudy", "<u>s</u>o", "<u>s</u>ix", "wa<u>sh</u>"], "a": 3, "u": 1, "hint": "So sánh /s/ (see, song, six) và /ʃ/ (she, show, shop, fish, wash). Chữ sh luôn đọc /ʃ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["look<u>ed</u>", "invit<u>ed</u>", "brush<u>ed</u>", "danc<u>ed</u>"], "a": 1, "u": 1, "hint": "Đuôi -ed đọc /t/ sau âm vô thanh (như /k/, /s/, /f/, /ʃ/, /p/), đọc /id/ sau âm /t/ và /d/, còn lại đọc /d/. Hãy đọc thầm động từ gốc rồi xét âm cuối."}]}, {"id": "d23-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "Many students ___ old books and clothes for poor children every year.", "o": ["donate", "exchange", "water", "tutor"], "a": 0, "u": 3, "hint": "Chọn động từ nghĩa 'quyên góp' sách và quần áo cũ cho trẻ nghèo."}, {"s": "Mai ___ an old man cross the road yesterday.", "o": ["helping", "helps", "helped", "help"], "a": 2, "u": 3, "hint": "Có 'yesterday': thì quá khứ đơn. Cấu trúc: help + người + (to) V."}, {"s": "Nursing homes are places for the ___ people.", "o": ["homeless", "young", "orphan", "elderly"], "a": 3, "u": 3, "hint": "Nursing home là nơi dành cho người cao tuổi: chọn tính từ chỉ người già."}, {"s": "We often pick ___ litter along the street on Sundays.", "o": ["in", "on", "at", "up"], "a": 3, "u": 3, "hint": "Cụm động từ 'pick ... litter' nghĩa là nhặt rác lên: chọn giới từ/trạng từ đi với pick."}, {"s": "The students ___ used paper for notebooks last month.", "o": ["exchanged", "exchanging", "exchange", "exchanges"], "a": 0, "u": 3, "hint": "Có 'last month': thì quá khứ đơn. Hành động: trao đổi giấy đã qua sử dụng."}, {"s": "Did you ___ the project last summer?", "o": ["join", "joins", "to join", "joined"], "a": 0, "u": 3, "hint": "Câu hỏi quá khứ với 'Did': động từ theo sau ở dạng nào?"}, {"s": "He is a ___ ; he works for the charity but doesn't get any money.", "o": ["vegetarian", "farmer", "volunteer", "doctor"], "a": 2, "u": 3, "hint": "Người làm việc cho tổ chức từ thiện mà không nhận tiền: nghĩa là 'tình nguyện viên'."}, {"s": "Children without parents live in an ___ .", "o": ["orphanage", "orphan", "office", "nursing"], "a": 0, "u": 3, "hint": "Chỗ ở của trẻ em không cha mẹ: cần danh từ chỉ nơi chốn (cô nhi viện), không phải danh từ chỉ người."}, {"s": "– “Why do you want to join the clean-up activity?” – “___”", "o": ["Yes, I'd love to.", "It takes two hours.", "Because I want to make our town cleaner.", "At the weekend."], "a": 2, "u": 3, "hint": "Câu hỏi 'Why ...?'. Câu đáp phải nêu lý do, thường bắt đầu bằng 'Because'."}, {"s": "Find the mistake: Last week, my class <u>visit</u> a nursing home <u>and</u> <u>talked</u> to <u>the old</u>.", "o": ["visit", "and", "talked", "the old"], "a": 0, "u": 3, "hint": "Có 'Last week': động từ chính phải ở thì quá khứ đơn. Tìm từ chưa chia đúng."}]}, {"id": "d23-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "She (brush) ___ her teeth twice a day.", "a": 0, "u": 2, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật), dấu hiệu 'twice'. Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["brushes", "brush", "brushing"], "c3": 1}, {"s": "She (buy) ___ a new camera last week.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["bought", "buy", "buys"], "c3": 1}, {"s": "He hates (get) ___ up early.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["getting", "get", "gets"], "c3": 1}, {"s": "Listen! Someone (sing) ___ in the next room.", "a": 0, "u": 1, "hint": "Dấu hiệu 'Listen!' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["is singing", "sings", "sang"], "c3": 1}, {"s": "My parents (be) ___ very tired last night.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["were", "was", "are"], "c3": 1}, {"s": "They (not play) ___ football now.", "a": 0, "u": 1, "hint": "Dấu hiệu 'now' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["are not playing", "are not play", "do not play"], "c3": 1}, {"s": "I want (join) ___ the English club.", "a": 0, "u": 1, "hint": "Sau want dùng to + động từ nguyên mẫu.", "o": ["to join", "joining", "join"], "c3": 1}]}, {"id": "d23-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "Last Sunday, we ___ trees in the school yard.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'trồng (cây)'. Động từ có quy tắc thêm -ed.", "o": ["planted", "plant", "planting"], "c3": 1}, {"s": "Nam ___ the vegetables in the garden yesterday morning.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'tưới'. Động từ có quy tắc thêm -ed.", "o": ["watered", "water", "watering"], "c3": 1}, {"s": "Mai ___ her old clothes to the orphanage last week.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'quyên góp'. Động từ có quy tắc thêm -ed.", "o": ["donated", "donate", "donating"], "c3": 1}, {"s": "I ___ maths to two small children last month.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'dạy kèm'. Động từ có quy tắc thêm -ed.", "o": ["tutored", "tutor", "tutoring"], "c3": 1}, {"s": "The students ___ up a lot of litter along the road yesterday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'nhặt'. Động từ có quy tắc thêm -ed.", "o": ["picked", "pick", "picking"], "c3": 1}, {"s": "We ___ the classroom after school last Friday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'lau dọn'. Động từ có quy tắc thêm -ed.", "o": ["cleaned", "clean", "cleaning"], "c3": 1}, {"s": "They ___ plastic bottles last term.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'tái chế'. Động từ có quy tắc thêm -ed.", "o": ["recycled", "recycle", "recycling"], "c3": 1}, {"s": "She ___ used paper for notebooks last week.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'trao đổi'. Động từ có quy tắc thêm -ed.", "o": ["exchanged", "exchange", "exchanging"], "c3": 1}, {"s": "The volunteers ___ the elderly with housework last weekend.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'giúp đỡ'. Động từ có quy tắc thêm -ed.", "o": ["helped", "help", "helping"], "c3": 1}, {"s": "Our class ___ the nursing home two days ago.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('ago'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'thăm'. Động từ có quy tắc thêm -ed.", "o": ["visited", "visit", "visiting"], "c3": 1}], "box": ["exchanged", "helped", "cleaned", "recycled", "tutored", "donated", "visited", "planted", "watered", "picked"]}, {"id": "d23-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "Where did Hung do volunteer work?", "o": ["At his school", "In a mountainous village", "In a city", "In a nursing home"], "a": 1, "u": 1, "hint": "Tìm cụm 'volunteer' ở câu đầu để biết địa điểm."}, {"s": "What did the volunteers do in the morning?", "o": ["They played football.", "They cooked lunch.", "They planted trees.", "They taught English."], "a": 3, "u": 1, "hint": "Tìm câu có 'Every morning'; xem Hung và bạn làm gì cho trẻ em."}, {"s": "What did they give the children at the end of the month?", "o": ["Old clothes", "Food", "Toys", "Notebooks and pens"], "a": 3, "u": 1, "hint": "Tìm câu có 'At the end of the month'; xem họ tặng các vật gì."}, {"s": "What can we infer from the passage?", "o": ["The children were rich.", "Hung didn't like the village.", "Hung enjoyed the project.", "The project was short."], "a": 2, "u": 1, "hint": "Câu suy luận: câu cuối cho biết Hung cảm thấy thế nào về dự án."}], "passage": "Last summer, Hung joined a volunteer project in a mountainous village. Every morning, he and his friends taught English to local children. In the afternoon, they cleaned the school yard and planted trees. At the end of the month, they gave notebooks and pens to the poor children. Hung says he learned a lot and made many new friends.", "ptitle": "A Volunteer Summer"}, {"id": "d23-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["take off", "take care", "take part", "take place"], "a": 2, "u": 3, "hint": "'___ in community activities': cụm động từ nghĩa 'tham gia'."}, {"o": ["lazy", "poor", "tall", "rich"], "a": 1, "u": 3, "hint": "'collect old clothes for the ___': đối tượng nhận quần áo cũ là những người cần giúp đỡ."}, {"o": ["trees", "skills", "games", "lessons"], "a": 1, "u": 3, "hint": "Hoạt động tình nguyện giúp em học được thêm điều gì?"}, {"o": ["afraid", "angry", "happy", "bored"], "a": 2, "u": 3, "hint": "Làm việc tốt khiến người ta có cảm xúc gì? Chọn tính từ tích cực."}], "passage": "Community service is very important. Many young people {1} in community activities such as planting trees and cleaning streets. They also collect old clothes for the {2} and tutor small children. These activities help them learn new {3} and make many friends. Doing community service also makes them feel {4} ."}, {"id": "d23-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "They love collecting coins.", "a": 0, "u": 1, "hint": "Dùng be + tính từ + giới từ + V-ing để diễn đạt sở thích (fond of / keen on / interested in / crazy about). Chọn cụm cùng nghĩa 'thích', rồi giữ nguyên phần V-ing.", "o": ["They are fond of collecting coins.", "They are fond of collect coins.", "They is fond of collecting coins."], "c3": 1}, {"s": "I wash my face. I brush my teeth.", "a": 0, "u": 2, "hint": "Hai hành động cùng chủ ngữ: nối bằng and, không lặp lại chủ ngữ, động từ thứ hai chia giống động từ thứ nhất.", "o": ["I wash my face and brush my teeth.", "I washes my face and brush my teeth.", "I wash my face or brush my teeth."], "c3": 1}, {"s": "He went to the park because he wanted to do exercise.", "a": 0, "u": 2, "hint": "Rút gọn 'because ... wanted to + V' thành mục đích: to + động từ nguyên mẫu, bỏ chủ ngữ và 'wanted'.", "o": ["He went to the park to do exercise.", "He went to park to do exercise.", "He went the park to do exercise."], "c3": 1}, {"s": "They planted trees in the park yesterday.", "a": 0, "u": 3, "hint": "Chuyển câu khẳng định quá khứ thành phủ định: did not + động từ nguyên mẫu (động từ chính trở về dạng gốc).", "o": ["They did not plant trees in the park yesterday.", "They did not planted trees in the park yesterday.", "They did not plant trees on the park yesterday."], "c3": 1}, {"s": "My father likes gardening at the weekend.", "a": 0, "u": 1, "hint": "Thay 'like' (hoặc 'doesn't like') bằng động từ chỉ sở thích đã cho, giữ nguyên V-ing sau nó.", "o": ["My father enjoys gardening at the weekend.", "My father enjoys garden at the weekend.", "My father enjoys gardening in the weekend."], "c3": 1}]}, {"id": "d23-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "to street children / last summer / taught / English / we", "a": 0, "u": 1, "hint": "Câu ở thì quá khứ đơn: S + V-ed/V2 + O + nơi chốn + thời gian (cụm thời gian có thể ở đầu hoặc cuối câu). Câu bắt đầu bằng: Last.", "o": ["Last summer we taught English to street children.", "We last summer taught English to street children.", "Taught we last summer English to street children."], "c3": 1}, {"s": "the river / to protect / they / clean up / the environment", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: They.", "o": ["They clean up the river to protect the environment.", "They the river clean up to protect the environment.", "Clean up they the river to protect the environment."], "c3": 1}, {"s": "to the homeless / food / give / the volunteers", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: The.", "o": ["The volunteers give food to the homeless.", "The volunteers food give to the homeless.", "Give the volunteers food to the homeless."], "c3": 1}, {"s": "yesterday / planted / trees / in the schoolyard / Nam", "a": 0, "u": 1, "hint": "Câu ở thì quá khứ đơn: S + V-ed/V2 + O + nơi chốn + thời gian (cụm thời gian có thể ở đầu hoặc cuối câu). Câu bắt đầu bằng: Nam.", "o": ["Nam planted trees in the schoolyard yesterday.", "Nam trees planted in the schoolyard yesterday.", "Planted Nam trees in the schoolyard yesterday."], "c3": 1}, {"s": "old books / donated / to poor children / I", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: I.", "o": ["I donated old books to poor children.", "I old books donated to poor children.", "Donated I old books to poor children."], "c3": 1}]}]}, {"id": "g7d24", "no": 24, "title": "Đề số 24", "acts": [{"id": "d24-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["mo<u>v</u>e", "lau<u>gh</u>", "<u>f</u>ood", "lea<u>f</u>"], "a": 0, "u": 1, "hint": "So sánh /f/ và /v/: f, ph và gh (trong laugh, enough, tough) đọc /f/; v đọc /v/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>th</u>ree", "bo<u>th</u>", "<u>th</u>ink", "<u>th</u>ese"], "a": 3, "u": 1, "hint": "So sánh /θ/ (thank, think, three, both, month, birthday) và /ð/ (this, these, they, mother, father, weather, together). Đặt lưỡi giữa răng, thử xem dây thanh quản có rung không."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["fi<u>sh</u>", "<u>s</u>ee", "<u>sh</u>op", "<u>sh</u>ape"], "a": 1, "u": 1, "hint": "So sánh /s/ (see, song, six) và /ʃ/ (she, show, shop, fish, wash). Chữ sh luôn đọc /ʃ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["visit<u>ed</u>", "need<u>ed</u>", "decid<u>ed</u>", "look<u>ed</u>"], "a": 3, "u": 1, "hint": "Đuôi -ed đọc /t/ sau âm vô thanh (như /k/, /s/, /f/, /ʃ/, /p/), đọc /id/ sau âm /t/ và /d/, còn lại đọc /d/. Hãy đọc thầm động từ gốc rồi xét âm cuối."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["book<u>s</u>", "coat<u>s</u>", "learn<u>s</u>", "laugh<u>s</u>"], "a": 2, "u": 1, "hint": "Đuôi -s/-es đọc /s/ sau âm vô thanh (/p/, /t/, /k/, /f/), đọc /iz/ sau âm gió (/s/, /z/, /ʃ/, /tʃ/, /dʒ/), còn lại đọc /z/."}]}, {"id": "d24-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "My brother goes ___ every Sunday morning.", "o": ["cycled", "cycle", "to cycle", "cycling"], "a": 3, "u": 2, "hint": "Go + V-ing cho hoạt động thể thao: đạp xe."}, {"s": "Tom is interested ___ playing table tennis.", "o": ["on", "of", "at", "in"], "a": 3, "u": 1, "hint": "Cụm cố định: interested + giới từ + V-ing. Nhớ giới từ đi với interested."}, {"s": "She ___ swimming three times a week to keep fit.", "o": ["is go", "going", "go", "goes"], "a": 3, "u": 2, "hint": "Có 'three times a week': hiện tại đơn, chủ ngữ she (số ít). Cấu trúc go swimming."}, {"s": "What ___ you do last night? – I watched a film.", "o": ["were", "do", "does", "did"], "a": 3, "u": 3, "hint": "Câu đáp 'I watched a film' là quá khứ; với 'last night' cần trợ động từ quá khứ."}, {"s": "Playing sports helps you stay ___ .", "o": ["fat", "fit", "tired", "sick"], "a": 1, "u": 2, "hint": "Chơi thể thao giúp cơ thể khoẻ mạnh: chọn tính từ 'cân đối, khoẻ' (stay + tính từ)."}, {"s": "My father hates ___ up early on Sundays.", "o": ["getting", "gets", "got", "get"], "a": 0, "u": 1, "hint": "Sau 'hate' (ghét) động từ ở dạng nào? Cụm: get up early."}, {"s": "Cycling is an ___ activity; you do it outside.", "o": ["outdoor", "indoor", "boring", "easy"], "a": 0, "u": 2, "hint": "Đạp xe là hoạt động làm ở bên ngoài trời: chọn tính từ đối lập với 'indoor'."}, {"s": "They are ___ badminton in the yard now.", "o": ["playing", "plays", "play", "played"], "a": 0, "u": 1, "hint": "Có 'now' trong câu với 'are': thì hiện tại tiếp diễn, động từ thêm -ing."}, {"s": "– “Do you want to play volleyball with us?” – “___”", "o": ["No, I didn't.", "Yes, I am.", "Sure, I'd love to.", "It's on Monday."], "a": 2, "u": 1, "hint": "Lời rủ chơi bóng chuyền. Chọn câu đáp đồng ý phù hợp với lời rủ 'Do you want to...?'."}, {"s": "Find the mistake: He <u>is</u> very <u>keen</u> <u>on</u> <u>play</u> chess.", "o": ["is", "keen", "on", "play"], "a": 3, "u": 1, "hint": "Sau 'keen on' động từ ở dạng nào? Tìm lỗi sai ở dạng động từ."}]}, {"id": "d24-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "My uncle (watch) ___ the news every evening.", "a": 0, "u": 1, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật), dấu hiệu 'every'. Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["watches", "watch", "watching"], "c3": 1}, {"s": "They (plant) ___ trees in the park yesterday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["planted", "plant", "plants"], "c3": 1}, {"s": "Lan adores (read) ___ comic books.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["reading", "read", "reads"], "c3": 1}, {"s": "At the moment, we (learn) ___ English.", "a": 0, "u": 1, "hint": "Dấu hiệu 'at the moment' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["are learning", "learn", "learned"], "c3": 1}, {"s": "It (be) ___ sunny last Sunday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["was", "were", "is"], "c3": 1}, {"s": "Hoa (not eat) ___ meat. She is a vegetarian.", "a": 0, "u": 2, "hint": "Chủ ngữ số ít, hiện tại đơn phủ định: dùng does not + động từ nguyên mẫu.", "o": ["does not eat", "do not eat", "does not eats"], "c3": 1}, {"s": "She goes to the park (do) ___ exercise.", "a": 0, "u": 2, "hint": "Chỉ mục đích (để làm gì): dùng to + động từ nguyên mẫu.", "o": ["to do", "doing", "do"], "c3": 1}]}, {"id": "d24-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "My mother dislikes ___ up at five in the morning.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'dậy (get up)'.", "o": ["getting", "get", "got"], "c3": 1}, {"s": "Nam always likes ___ his teeth before going to bed.", "a": 0, "u": 2, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'đánh (răng)'.", "o": ["brushing", "brush", "brushed"], "c3": 1}, {"s": "Does your sister hate ___ cold food?", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'ăn'.", "o": ["eating", "eat", "ate"], "c3": 1}, {"s": "I adore ___ to pop music in my room.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'nghe'.", "o": ["listening", "listen", "listened"], "c3": 1}, {"s": "They don't fancy ___ video games all day.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'chơi'.", "o": ["playing", "play", "played"], "c3": 1}, {"s": "My father enjoys ___ the football match on TV.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'xem'.", "o": ["watching", "watch", "watched"], "c3": 1}, {"s": "Hoa loves ___ pictures of flowers.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'vẽ'.", "o": ["drawing", "draw", "drew"], "c3": 1}, {"s": "We like ___ in the sea in summer.", "a": 0, "u": 2, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'bơi'.", "o": ["swimming", "swim", "swam"], "c3": 1}, {"s": "Does he like ___ the dishes after dinner?", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'rửa, giặt'.", "o": ["washing", "wash", "washed"], "c3": 1}, {"s": "Lan loves ___ photos of her pets.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'chụp (ảnh)'.", "o": ["taking", "take", "took"], "c3": 1}], "box": ["playing", "swimming", "washing", "getting", "watching", "taking", "brushing", "listening", "eating", "drawing"]}, {"id": "d24-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "How often does the club meet?", "o": ["Once a week", "Three times a week", "Twice a week", "Every day"], "a": 2, "u": 1, "hint": "Tìm câu có 'every Tuesday and Friday'; đếm số buổi mỗi tuần để chọn cách nói tần suất."}, {"s": "What do the members do on Fridays?", "o": ["They swim.", "They go jogging.", "They play basketball.", "They cycle."], "a": 1, "u": 1, "hint": "Tìm câu bắt đầu bằng 'On Fridays'."}, {"s": "Which prize did the writer's team win?", "o": ["Third prize", "First prize", "No prize", "Second prize"], "a": 3, "u": 1, "hint": "Tìm câu có 'competition' và 'won'."}, {"s": "Why does the writer love the club?", "o": ["The teacher is kind.", "The club is near home.", "The club is free.", "Sports help the writer keep fit and make friends."], "a": 3, "u": 1, "hint": "Tìm câu cuối có 'because', phần sau 'because' là lý do."}], "passage": "I am a member of the school sports club. We meet every Tuesday and Friday after school. On Tuesdays, we play basketball. On Fridays, we go jogging around the school yard. Last month, our club had a small competition. My team won second prize. I love the club because sports help me keep fit and make friends.", "ptitle": "My Sports Club"}, {"id": "d24-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["club", "health", "hobby", "skin"], "a": 1, "u": 2, "hint": "'good for our ___': chọn từ nói về sức khoẻ cơ thể."}, {"o": ["boat", "bike", "bus", "horse"], "a": 1, "u": 2, "hint": "Phương tiện em có thể 'ride' (cưỡi/đạp) ở đây. Loại thể thao nào cần ride?"}, {"o": ["days off", "hours", "years", "times"], "a": 3, "u": 2, "hint": "'at least three ___ a week': đơn vị đếm số lần trong tuần."}, {"o": ["jump", "ride", "rest", "run"], "a": 2, "u": 2, "hint": "'If you feel pain, you should stop and take a ___': cần cụm nghĩa 'nghỉ ngơi'."}], "passage": "Doing exercise is good for our {1} . It helps our heart and muscles become strong. You can play football, go swimming or ride a {2} . You should exercise at least three {3} a week. If you feel pain, you should stop and take a {4} ."}, {"id": "d24-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "It is good for your health to do morning exercise.", "a": 0, "u": 2, "hint": "Dùng V-ing làm chủ ngữ: V-ing + ... + is + tính từ, thay cho cấu trúc 'It is + tính từ + to V'.", "o": ["Doing morning exercise is good for your health.", "Doing morning exercise are good for your health.", "Doing morning exercise is good to your health."], "c3": 1}, {"s": "It is a good idea to eat more fruit.", "a": 0, "u": 2, "hint": "Dùng should (nên) hoặc shouldn't (không nên) + động từ nguyên mẫu để nói lời khuyên, thay cho 'It is a (not) good idea / not healthy'.", "o": ["You should eat more fruit.", "You should to eat more fruit.", "You should eating more fruit."], "c3": 1}, {"s": "Linh finds playing board games boring.", "a": 0, "u": 1, "hint": "Chuyển 'find + V-ing + tính từ' thành 'think that + V-ing + is + tính từ'. Chú ý chủ ngữ số ít nên dùng is.", "o": ["Linh thinks that playing board games is boring.", "Linh thinks that playing board games are boring.", "Linh thinks that playing board games boring."], "c3": 1}, {"s": "We didn't eat fast food. Hoa didn't eat fast food.", "a": 0, "u": 2, "hint": "Cấu trúc Neither A nor B: câu có nghĩa phủ định nhưng động từ ở dạng khẳng định, chia theo thì quá khứ.", "o": ["Neither we nor Hoa ate fast food.", "Neither we or Hoa ate fast food.", "Neither we nor Hoa didn't eat fast food."], "c3": 1}, {"s": "You must be quick or you will be late for school.", "a": 0, "u": 2, "hint": "Dùng câu điều kiện loại 1: If + hiện tại đơn, S + will + V. Nếu câu gốc có 'must ... or' thì mệnh đề If ở dạng phủ định.", "o": ["If you are not quick, you will be late for school.", "If you are not quick, you will is late for school.", "If you will are not quick, you will be late for school."], "c3": 1}]}, {"id": "d24-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "goes / twice a week / swimming / my sister", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: My.", "o": ["My sister goes swimming twice a week.", "My sister swimming goes twice a week.", "Goes my sister swimming twice a week."], "c3": 1}, {"s": "playing / he / football / after school / enjoys", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: He.", "o": ["He enjoys playing football after school.", "He playing enjoys football after school.", "Enjoys he playing football after school."], "c3": 1}, {"s": "often / go cycling / do / you", "a": 0, "u": 1, "hint": "Câu hỏi Yes/No ở hiện tại đơn: Do + chủ ngữ + động từ nguyên mẫu ...? Câu bắt đầu bằng: Do.", "o": ["Do you often go cycling?", "You do often go cycling?", "Do you go often cycling?"], "c3": 1}, {"s": "jogging / in the rain / Nam / like / doesn't", "a": 0, "u": 1, "hint": "Cấu trúc phủ định: S + doesn't/didn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: Nam.", "o": ["Nam doesn't like jogging in the rain.", "Nam like doesn't jogging in the rain.", "Nam doesn't jogging like in the rain."], "c3": 1}, {"s": "do / every day / we / exercise / should", "a": 0, "u": 1, "hint": "Cấu trúc: S + should/shouldn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: We.", "o": ["We should do exercise every day.", "We do should exercise every day.", "We should exercise do every day."], "c3": 1}]}]}, {"id": "g7d25", "no": 25, "title": "Đề số 25", "acts": [{"id": "d25-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["bo<u>th</u>", "toge<u>th</u>er", "wea<u>th</u>er", "<u>th</u>ey"], "a": 0, "u": 1, "hint": "So sánh /θ/ (thank, think, three, both, month, birthday) và /ð/ (this, these, they, mother, father, weather, together). Đặt lưỡi giữa răng, thử xem dây thanh quản có rung không."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>s</u>un", "fi<u>sh</u>", "<u>sh</u>e", "<u>sh</u>ort"], "a": 0, "u": 1, "hint": "So sánh /s/ (see, song, six) và /ʃ/ (she, show, shop, fish, wash). Chữ sh luôn đọc /ʃ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["learn<u>ed</u>", "miss<u>ed</u>", "show<u>ed</u>", "clean<u>ed</u>"], "a": 1, "u": 1, "hint": "Đuôi -ed đọc /t/ sau âm vô thanh (như /k/, /s/, /f/, /ʃ/, /p/), đọc /id/ sau âm /t/ và /d/, còn lại đọc /d/. Hãy đọc thầm động từ gốc rồi xét âm cuối."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["learn<u>s</u>", "class<u>es</u>", "bus<u>es</u>", "wash<u>es</u>"], "a": 0, "u": 1, "hint": "Đuôi -s/-es đọc /s/ sau âm vô thanh (/p/, /t/, /k/, /f/), đọc /iz/ sau âm gió (/s/, /z/, /ʃ/, /tʃ/, /dʒ/), còn lại đọc /z/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["l<u>ear</u>n", "th<u>ir</u>d", "cam<u>e</u>ra", "n<u>ur</u>se"], "a": 2, "u": 1, "hint": "So sánh âm /ɜː/ (như trong 'bird', 'nurse') và âm /ə/ (âm yếu, ngắn như ở cuối 'teacher', đầu 'about'). Đọc chậm từng từ rồi nghe âm gạch chân."}]}, {"id": "d25-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "Tofu is a product from ___ .", "o": ["meat", "fish", "lemons", "soybeans"], "a": 3, "u": 2, "hint": "Đậu hũ làm từ nguyên liệu nào? Nhớ nó là sản phẩm từ cây."}, {"s": "Her lips are red and ___ because of the cold weather.", "o": ["fresh", "chapped", "healthy", "dim"], "a": 1, "u": 2, "hint": "Môi nứt nẻ khi trời lạnh: tính từ chỉ môi bị khô, nứt."}, {"s": "You should put on some ___ to protect your skin from the sun.", "o": ["soap", "suncream", "milk", "lip balm"], "a": 1, "u": 2, "hint": "Để bảo vệ da khỏi nắng, em thoa thứ gì lên da? Chọn sản phẩm chống nắng."}, {"s": "Don't read in ___ light because it is bad for your eyes.", "o": ["dim", "bright", "day", "natural"], "a": 0, "u": 2, "hint": "Đọc sách trong ánh sáng thiếu sáng là hại mắt: chọn tính từ chỉ ánh sáng mờ."}, {"s": "Mai ___ some red spots on her face last week.", "o": ["has", "have", "having", "had"], "a": 3, "u": 2, "hint": "Có 'last week': thì quá khứ đơn, động từ 'have' có dạng quá khứ bất quy tắc."}, {"s": "Boys don't have as much acne ___ girls.", "o": ["so", "as", "than", "like"], "a": 1, "u": 2, "hint": "So sánh bằng: not as + tính từ/danh từ + as. Chọn từ để hoàn thành cấu trúc."}, {"s": "My brother usually ___ to school by bike.", "o": ["going", "goes", "go", "went"], "a": 1, "u": 1, "hint": "Có 'usually' và chủ ngữ my brother (số ít): hiện tại đơn, thêm -es."}, {"s": "We ___ any lessons on Sundays.", "o": ["not have", "aren't have", "doesn't have", "don't have"], "a": 3, "u": 1, "hint": "Chủ ngữ 'We' phủ định ở hiện tại đơn: dùng trợ động từ nào?"}, {"s": "– “I have a toothache.” – “___”", "o": ["Yes, it is.", "It's a good idea to play.", "You should see the dentist.", "You are welcome."], "a": 2, "u": 2, "hint": "Người bệnh nói đau răng. Chọn lời khuyên phù hợp (should + hành động)."}, {"s": "Find the mistake: Mai <u>doesn't</u> <u>like</u> <u>to</u> <u>did</u> the housework.", "o": ["doesn't", "like", "to", "did"], "a": 3, "u": 1, "hint": "Cấu trúc: doesn't like to + động từ ở dạng nào? Tìm động từ chia sai."}]}, {"id": "d25-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "Water (boil) ___ at 100 degrees.", "a": 0, "u": 1, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật). Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["boils", "boil", "boiling"], "c3": 1}, {"s": "Nam (make) ___ a model plane last month.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["made", "make", "makes"], "c3": 1}, {"s": "They dislike (stay) ___ at home on Sundays.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["staying", "stay", "stays"], "c3": 1}, {"s": "Mai (water) ___ the flowers in the garden now.", "a": 0, "u": 3, "hint": "Dấu hiệu 'now' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["is watering", "waters", "watered"], "c3": 1}, {"s": "Lan (be) ___ absent from class yesterday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["was", "were", "is"], "c3": 1}, {"s": "I (not see) ___ him yesterday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): phủ định quá khứ đơn dùng did not + động từ nguyên mẫu.", "o": ["did not see", "did not saw", "does not see"], "c3": 1}, {"s": "Why don't we (clean) ___ the school yard?", "a": 0, "u": 3, "hint": "Cấu trúc đề nghị Why don't we + động từ nguyên mẫu?", "o": ["clean", "to clean", "cleaning"], "c3": 1}]}, {"id": "d25-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "Soy milk is made from ___ .", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'đậu nành' phù hợp với chỗ trống.", "o": ["soybeans", "chapped", "indoor"], "c3": 1}, {"s": "Meat and fish have a lot of ___ .", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'chất đạm' phù hợp với chỗ trống.", "o": ["protein", "dim", "chapped"], "c3": 1}, {"s": "Don't read in ___ light; it hurts your eyes.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'mờ, yếu (ánh sáng)' phù hợp với chỗ trống.", "o": ["dim", "skin", "protein"], "c3": 1}, {"s": "Her lips are red and ___ in winter.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'nứt nẻ (môi)' phù hợp với chỗ trống.", "o": ["chapped", "skin", "protein"], "c3": 1}, {"s": "Use suncream to protect your ___ .", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'làn da' phù hợp với chỗ trống.", "o": ["skin", "chapped", "dim"], "c3": 1}, {"s": "Teenagers often suffer from ___ .", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'mụn trứng cá' phù hợp với chỗ trống.", "o": ["acne", "indoor", "dim"], "c3": 1}, {"s": "My mother puts rice and fish in my ___ box.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'bữa trưa' phù hợp với chỗ trống.", "o": ["lunch", "indoor", "dim"], "c3": 1}, {"s": "Chess and reading are ___ activities.", "a": 0, "u": 1, "hint": "Tìm trong khung từ nghĩa 'trong nhà' phù hợp với chỗ trống.", "o": ["indoor", "tofu", "soybeans"], "c3": 1}, {"s": "My aunt often cooks ___ with tomatoes.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'đậu phụ' phù hợp với chỗ trống.", "o": ["tofu", "chapped", "indoor"], "c3": 1}, {"s": "A person who doesn't eat meat or fish is a ___ .", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'người ăn chay' phù hợp với chỗ trống.", "o": ["vegetarian", "indoor", "chapped"], "c3": 1}], "box": ["acne", "skin", "protein", "tofu", "indoor", "dim", "vegetarian", "chapped", "soybeans", "lunch"]}, {"id": "d25-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "What is acne?", "o": ["A kind of sport", "A kind of food", "A hat", "A skin problem with small red spots"], "a": 3, "u": 1, "hint": "Tìm câu có 'Acne often appears'; xem mụn trứng cá được mô tả thế nào."}, {"s": "How often should you wash your face?", "o": ["Every month", "Once a week", "Twice a day", "Three times an hour"], "a": 2, "u": 1, "hint": "Tìm câu có 'wash your face'; xem tần suất."}, {"s": "What should you do to avoid sunburn?", "o": ["Wear a hat and put on suncream", "Touch your face", "Drink soft drinks", "Stay up late"], "a": 0, "u": 1, "hint": "Tìm câu bắt đầu bằng 'In summer'; xem hai việc nên làm."}, {"s": "What is the passage about?", "o": ["Hobbies of teenagers", "How to look after your skin", "Why hats are expensive", "How to cook vegetables"], "a": 1, "u": 1, "hint": "Câu hỏi ý chính: bao quát cả đoạn văn nói về vấn đề gì của teen và cách xử lý."}], "passage": "Many teenagers have skin problems such as acne and sunburn. Acne often appears on the face as small red spots. To avoid it, you should wash your face twice a day and not touch it with dirty hands. In summer, you should wear a hat and put on some suncream when you go out. You should also eat more vegetables and fruit.", "ptitle": "Take Care of Your Skin"}, {"id": "d25-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["meat", "tofu", "rice", "fruit"], "a": 0, "u": 2, "hint": "Maria ăn chay: cô ấy không ăn thứ nào? (đối lập với fish)"}, {"o": ["beef", "milk", "pork", "chicken"], "a": 1, "u": 2, "hint": "Bữa sáng gồm bánh mì và một ly... đồ uống thường dùng."}, {"o": ["fish", "tofu", "pork", "chicken"], "a": 1, "u": 2, "hint": "Bữa trưa của người ăn chay: gạo, rau và món thay thịt làm từ đậu nành."}, {"o": ["on", "with", "at", "for"], "a": 3, "u": 2, "hint": "'good ___ her health': giới từ đi với good khi chỉ lợi ích cho đối tượng."}], "passage": "Maria is a vegetarian. She doesn't eat {1} or fish. Her breakfast is usually bread and a glass of {2} . For lunch she often has rice, vegetables and {3} . She thinks this diet is good {4} her health."}, {"id": "d25-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "My sister likes making models.", "a": 0, "u": 1, "hint": "Dùng be + tính từ + giới từ + V-ing để diễn đạt sở thích (fond of / keen on / interested in / crazy about). Chọn cụm cùng nghĩa 'thích', rồi giữ nguyên phần V-ing.", "o": ["My sister is interested in making models.", "My sister is interested in make models.", "My sister are interested in making models."], "c3": 1}, {"s": "She wears a hat. She puts on some suncream.", "a": 0, "u": 2, "hint": "Hai hành động cùng chủ ngữ: nối bằng and, không lặp lại chủ ngữ, động từ thứ hai chia giống động từ thứ nhất.", "o": ["She wears a hat and puts on some suncream.", "She wears a hat or puts on some suncream.", "She wears a hat and puts of some suncream."], "c3": 1}, {"s": "We use suncream because we want to avoid sunburn.", "a": 0, "u": 2, "hint": "Rút gọn 'because ... wanted to + V' thành mục đích: to + động từ nguyên mẫu, bỏ chủ ngữ và 'wante
