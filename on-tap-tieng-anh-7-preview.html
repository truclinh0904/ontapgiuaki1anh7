d'.", "o": ["We use suncream to avoid sunburn.", "We use suncream to avoiding sunburn.", "We use suncream avoid sunburn."], "c3": 1}, {"s": "Lan helped the elderly last Sunday.", "a": 0, "u": 3, "hint": "Chuyển thành câu hỏi Yes/No ở quá khứ: Did + chủ ngữ + động từ nguyên mẫu ...?", "o": ["Did Lan help the elderly last Sunday?", "Did Lan helped the elderly last Sunday?", "Did Lan help elderly last Sunday?"], "c3": 1}, {"s": "Mai doesn't like doing puzzles.", "a": 0, "u": 1, "hint": "Thay 'like' (hoặc 'doesn't like') bằng động từ chỉ sở thích đã cho, giữ nguyên V-ing sau nó.", "o": ["Mai dislikes doing puzzles.", "Mai dislikes do puzzles.", "Mai doesn't dislike doing puzzles."], "c3": 1}]}, {"id": "d25-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "many people / sunburn / in summer / affects", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: Sunburn.", "o": ["Sunburn affects many people in summer.", "Sunburn many people affects in summer.", "Affects sunburn many people in summer."], "c3": 1}, {"s": "and sweetened food / soft drinks / avoid / we", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: We.", "o": ["We avoid soft drinks and sweetened food.", "We soft drinks avoid and sweetened food.", "Avoid we soft drinks and sweetened food."], "c3": 1}, {"s": "for breakfast / has / milk and bread / she", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: She.", "o": ["She has milk and bread for breakfast.", "She milk and bread has for breakfast.", "Has she milk and bread for breakfast."], "c3": 1}, {"s": "protein / tofu / a lot of / has", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: Tofu.", "o": ["Tofu has a lot of protein.", "Tofu a lot of has protein.", "Has tofu a lot of protein."], "c3": 1}, {"s": "skip / shouldn't / you / breakfast", "a": 0, "u": 1, "hint": "Cấu trúc: S + should/shouldn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: You.", "o": ["You shouldn't skip breakfast.", "You skip shouldn't breakfast.", "You shouldn't breakfast skip."], "c3": 1}]}]}, {"id": "g7d26", "no": 26, "title": "Đề số 26", "acts": [{"id": "d26-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>s</u>ee", "<u>s</u>ong", "<u>sh</u>op", "<u>s</u>ix"], "a": 2, "u": 1, "hint": "So sánh /s/ (see, song, six) và /ʃ/ (she, show, shop, fish, wash). Chữ sh luôn đọc /ʃ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["call<u>ed</u>", "liv<u>ed</u>", "visit<u>ed</u>", "tidi<u>ed</u>"], "a": 2, "u": 1, "hint": "Đuôi -ed đọc /t/ sau âm vô thanh (như /k/, /s/, /f/, /ʃ/, /p/), đọc /id/ sau âm /t/ và /d/, còn lại đọc /d/. Hãy đọc thầm động từ gốc rồi xét âm cuối."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["cook<u>s</u>", "part<u>s</u>", "bag<u>s</u>", "laugh<u>s</u>"], "a": 2, "u": 1, "hint": "Đuôi -s/-es đọc /s/ sau âm vô thanh (/p/, /t/, /k/, /f/), đọc /iz/ sau âm gió (/s/, /z/, /ʃ/, /tʃ/, /dʒ/), còn lại đọc /z/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["n<u>ur</u>se", "c<u>o</u>llect", "<u>a</u>bout", "cam<u>e</u>ra"], "a": 0, "u": 1, "hint": "So sánh âm /ɜː/ (như trong 'bird', 'nurse') và âm /ə/ (âm yếu, ngắn như ở cuối 'teacher', đầu 'about'). Đọc chậm từng từ rồi nghe âm gạch chân."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["li<u>f</u>e", "tou<u>gh</u>", "<u>f</u>ood", "<u>v</u>ery"], "a": 3, "u": 1, "hint": "So sánh /f/ và /v/: f, ph và gh (trong laugh, enough, tough) đọc /f/; v đọc /v/."}]}, {"id": "d26-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "My class often visits the nursing home to ___ the elderly.", "o": ["helping", "helped", "help", "helps"], "a": 2, "u": 3, "hint": "Sau 'to' chỉ mục đích, động từ ở dạng nào? Nghĩa: giúp đỡ người già."}, {"s": "Nga ___ to the orphanage by bike last Saturday.", "o": ["going", "go", "goes", "went"], "a": 3, "u": 3, "hint": "Có 'last Saturday': thì quá khứ đơn. Động từ 'go' có dạng quá khứ bất quy tắc."}, {"s": "They ___ plastic bottles for recycling at the moment.", "o": ["collects", "collect", "collected", "are collecting"], "a": 3, "u": 3, "hint": "Có 'at the moment': thì hiện tại tiếp diễn, chủ ngữ They (số nhiều)."}, {"s": "___ elderly need our care and love.", "o": ["The", "This", "A", "An"], "a": 0, "u": 3, "hint": "Nói chung về một nhóm người (người cao tuổi): chọn mạo từ đứng trước tính từ khi dùng như danh từ chỉ nhóm."}, {"s": "Mr Binh ___ a volunteer two years ago.", "o": ["is", "be", "were", "was"], "a": 3, "u": 3, "hint": "Có 'two years ago' và chủ ngữ Mr Binh (số ít): thì quá khứ của 'to be'."}, {"s": "Last term, we raised money ___ the poor children.", "o": ["at", "in", "on", "for"], "a": 3, "u": 3, "hint": "Gây quỹ cho trẻ nghèo: chọn giới từ chỉ mục đích/người nhận (raise money + giới từ)."}, {"s": "The ___ people have no house to live in.", "o": ["elderly", "homeless", "young", "rich"], "a": 1, "u": 3, "hint": "Người không có nhà để ở: chọn tính từ chỉ người vô gia cư."}, {"s": "My brother wants ___ a volunteer at the nursing home.", "o": ["is", "to be", "being", "be"], "a": 1, "u": 3, "hint": "Cấu trúc: want + giới từ/dạng động từ nào? 'Muốn trở thành'."}, {"s": "– “How can we help the elderly?” – “___”", "o": ["Because it is fun.", "We went there yesterday.", "We can talk to them and read books.", "They are very old."], "a": 2, "u": 3, "hint": "Câu hỏi 'How can we help...?'. Chọn câu đáp nêu cách giúp đỡ cụ thể."}, {"s": "Find the mistake: Hoa <u>don't</u> <u>go</u> to the <u>club</u> <u>yesterday</u>.", "o": ["don't", "go", "club", "yesterday"], "a": 0, "u": 3, "hint": "Có 'yesterday': động từ chính và trợ động từ phải ở thì quá khứ. Tìm chỗ sai."}]}, {"id": "d26-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "Lan (study) ___ English at seven every morning.", "a": 0, "u": 1, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật), dấu hiệu 'every'. Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["studies", "study", "studying"], "c3": 1}, {"s": "My class (collect) ___ old books last term.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["collected", "collect", "collects"], "c3": 1}, {"s": "Does your brother fancy (play) ___ chess?", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["playing", "play", "plays"], "c3": 1}, {"s": "They (clean) ___ the street at the moment.", "a": 0, "u": 3, "hint": "Dấu hiệu 'at the moment' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["are cleaning", "clean", "cleaned"], "c3": 1}, {"s": "The films (be) ___ very funny last night.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["were", "was", "are"], "c3": 1}, {"s": "Nam (not join) ___ the club last year.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): phủ định quá khứ đơn dùng did not + động từ nguyên mẫu.", "o": ["did not join", "did not joined", "does not join"], "c3": 1}, {"s": "If it (rain) ___ tomorrow, we will stay at home.", "a": 0, "u": 2, "hint": "Mệnh đề If trong câu điều kiện loại 1 dùng thì hiện tại đơn (không dùng will); chủ ngữ you/it xác định dạng động từ.", "o": ["rains", "rain", "raining"], "c3": 1}]}, {"id": "d26-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "Last weekend, we ___ old books for the poor children.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'sưu tầm, thu gom'. Động từ có quy tắc thêm -ed.", "o": ["collected", "collect", "collecting"], "c3": 1}, {"s": "Mai ___ a card for the elderly last Sunday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'làm'. Đây là động từ bất quy tắc.", "o": ["made", "make", "making"], "c3": 1}, {"s": "My mother ___ a big pot of soup for the homeless yesterday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'nấu'. Động từ có quy tắc thêm -ed.", "o": ["cooked", "cook", "cooking"], "c3": 1}, {"s": "Tom ___ a poor boy his old bike last year.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'đưa, tặng'. Đây là động từ bất quy tắc.", "o": ["gave", "give", "giving"], "c3": 1}, {"s": "She ___ a letter to her pen friend last night.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'viết'. Đây là động từ bất quy tắc.", "o": ["wrote", "write", "writing"], "c3": 1}, {"s": "The volunteers ___ English to street children last summer.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'dạy'. Đây là động từ bất quy tắc.", "o": ["taught", "teach", "teaching"], "c3": 1}, {"s": "We ___ warm blankets from the market yesterday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'mua'. Đây là động từ bất quy tắc.", "o": ["bought", "buy", "buying"], "c3": 1}, {"s": "The farmer ___ his vegetables at the market two days ago.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('ago'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'bán'. Đây là động từ bất quy tắc.", "o": ["sold", "sell", "selling"], "c3": 1}, {"s": "Linh ___ some sweets to the nursing home last Saturday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'mang đến'. Đây là động từ bất quy tắc.", "o": ["brought", "bring", "bringing"], "c3": 1}, {"s": "My brother ___ part in a clean-up activity last month.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'lấy, tham gia (take part)'. Đây là động từ bất quy tắc.", "o": ["took", "take", "taking"], "c3": 1}], "box": ["cooked", "taught", "brought", "made", "collected", "sold", "wrote", "bought", "took", "gave"]}, {"id": "d26-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "How often do the students visit the nursing home?", "o": ["Every day", "Once a month", "Twice a week", "Once a year"], "a": 1, "u": 1, "hint": "Tìm câu 'Every first Sunday of the month'; tính xem một tháng đến mấy lần."}, {"s": "What do the students do there?", "o": ["They sell books.", "They teach maths.", "They cook meals.", "They talk, sing and read stories."], "a": 3, "u": 1, "hint": "Tìm câu 'They talk to the old people...' và đọc các hoạt động liệt kê."}, {"s": "Who lives in the nursing home?", "o": ["Mai's grandmother", "Mai's teacher", "Mai's cousin", "Mai's mother"], "a": 0, "u": 1, "hint": "Tìm câu có 'grandmother, who lives there'."}, {"s": "What can we infer from the passage?", "o": ["The visits are useful to the old people.", "Mai is a nurse.", "The old people dislike visitors.", "The nursing home is far away."], "a": 0, "u": 1, "hint": "Câu cuối nêu tác dụng của các chuyến thăm đối với người già; chọn ý đúng."}], "passage": "Every first Sunday of the month, Mai and her classmates visit a nursing home near their school. They talk to the old people, sing songs and read them stories. Sometimes they help the old people clean their rooms. Last Sunday, Mai's grandmother, who lives there, was very happy because she saw her granddaughter. The old people say the visits make them feel less lonely.", "ptitle": "At the Nursing Home"}, {"id": "d26-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["bringing", "brings", "brought", "bring"], "a": 2, "u": 3, "hint": "Câu mở đầu có 'Last Sunday' nên động từ ở thì quá khứ đơn; 'bring' là động từ bất quy tắc."}, {"o": ["angry", "tired of", "sad", "happy"], "a": 3, "u": 3, "hint": "Họ đã chơi trò chơi và hát cùng trẻ: các em cảm thấy thế nào? Chọn tính từ tích cực."}, {"o": ["planted", "plants", "planting", "plant"], "a": 0, "u": 3, "hint": "Câu cùng thì quá khứ với 'cleaned': chọn dạng đúng của động từ 'trồng'."}, {"o": ["quietly", "sadly", "badly", "good"], "a": 3, "u": 3, "hint": "'felt very ___': sau 'felt' cần tính từ, không phải trạng từ."}], "passage": "Last Sunday, our class went to an orphanage. We {1} small gifts and books for the children. We played games and sang songs with them. They were very {2} . After that, we cleaned their yard and {3} flowers. We came home late, but we felt very {4} ."}, {"id": "d26-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "It is not healthy to eat a lot of sugar.", "a": 0, "u": 2, "hint": "Dùng V-ing làm chủ ngữ: V-ing + ... + is + tính từ, thay cho cấu trúc 'It is + tính từ + to V'.", "o": ["Eating a lot of sugar is not healthy.", "Eating a lot of sugar are not healthy.", "Eating a lot on sugar is not healthy."], "c3": 1}, {"s": "It is not a good idea to stay up late.", "a": 0, "u": 2, "hint": "Dùng should (nên) hoặc shouldn't (không nên) + động từ nguyên mẫu để nói lời khuyên, thay cho 'It is a (not) good idea / not healthy'.", "o": ["You shouldn't stay up late.", "You shouldn't to stay up late.", "You shouldn't staying up late."], "c3": 1}, {"s": "We find making models difficult.", "a": 0, "u": 1, "hint": "Chuyển 'find + V-ing + tính từ' thành 'think that + V-ing + is + tính từ'. Chú ý chủ ngữ số ít nên dùng is.", "o": ["We think that making models is difficult.", "We think that making models are difficult.", "We think that making models difficult."], "c3": 1}, {"s": "My dad loves outdoor activities. I love outdoor activities.", "a": 0, "u": 2, "hint": "Cấu trúc Both A and B + động từ số nhiều; danh từ cuối câu để ở số nhiều.", "o": ["Both my dad and I love outdoor activities.", "Both my dad and I loves outdoor activities.", "Both my dad or I love outdoor activities."], "c3": 1}, {"s": "Eat lots of vegetables and you will stay healthy.", "a": 0, "u": 2, "hint": "Dùng câu điều kiện loại 1: If + hiện tại đơn, S + will + V. Nếu câu gốc có 'must ... or' thì mệnh đề If ở dạng phủ định.", "o": ["If you eat lots of vegetables, you will stay healthy.", "If you eat lots of vegetables, you will stays healthy.", "If you will eat lots of vegetables, you will stay healthy."], "c3": 1}]}, {"id": "d26-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "our care / the elderly / need", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: The.", "o": ["The elderly need our care.", "The elderly our care need.", "Need the elderly our care."], "c3": 1}, {"s": "the nursing home / visited / last Sunday / we", "a": 0, "u": 1, "hint": "Câu ở thì quá khứ đơn: S + V-ed/V2 + O + nơi chốn + thời gian (cụm thời gian có thể ở đầu hoặc cuối câu). Câu bắt đầu bằng: We.", "o": ["We visited the nursing home last Sunday.", "We the nursing home visited last Sunday.", "Visited we the nursing home last Sunday."], "c3": 1}, {"s": "to children / often / read / the volunteers / books", "a": 0, "u": 1, "hint": "Trạng từ tần suất (never, often, always...) đứng trước động từ thường; thứ tự: S + trạng từ + V + O. Câu bắt đầu bằng: The.", "o": ["The volunteers often read books to children.", "The volunteers read often books to children.", "The volunteers often books read to children."], "c3": 1}, {"s": "didn't / to the club / go / yesterday / she", "a": 0, "u": 1, "hint": "Cấu trúc phủ định: S + doesn't/didn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: She.", "o": ["She didn't go to the club yesterday.", "She go didn't to the club yesterday.", "She didn't to the club go yesterday."], "c3": 1}, {"s": "is / my class / now / collecting / old clothes", "a": 0, "u": 1, "hint": "Thì hiện tại tiếp diễn: S + am/is/are + V-ing + tân ngữ + now. Câu bắt đầu bằng: My.", "o": ["My class is collecting old clothes now.", "My class collecting is old clothes now.", "My class is old clothes collecting now."], "c3": 1}]}]}, {"id": "g7d27", "no": 27, "title": "Đề số 27", "acts": [{"id": "d27-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["play<u>ed</u>", "call<u>ed</u>", "enjoy<u>ed</u>", "fix<u>ed</u>"], "a": 3, "u": 1, "hint": "Đuôi -ed đọc /t/ sau âm vô thanh (như /k/, /s/, /f/, /ʃ/, /p/), đọc /id/ sau âm /t/ và /d/, còn lại đọc /d/. Hãy đọc thầm động từ gốc rồi xét âm cuối."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["learn<u>s</u>", "pen<u>s</u>", "girl<u>s</u>", "danc<u>es</u>"], "a": 3, "u": 1, "hint": "Đuôi -s/-es đọc /s/ sau âm vô thanh (/p/, /t/, /k/, /f/), đọc /iz/ sau âm gió (/s/, /z/, /ʃ/, /tʃ/, /dʒ/), còn lại đọc /z/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["g<u>ir</u>l", "b<u>ir</u>d", "s<u>o</u>fa", "w<u>or</u>ld"], "a": 2, "u": 1, "hint": "So sánh âm /ɜː/ (như trong 'bird', 'nurse') và âm /ə/ (âm yếu, ngắn như ở cuối 'teacher', đầu 'about'). Đọc chậm từng từ rồi nghe âm gạch chân."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>v</u>oice", "lau<u>gh</u>", "ha<u>v</u>e", "o<u>f</u>"], "a": 1, "u": 1, "hint": "So sánh /f/ và /v/: f, ph và gh (trong laugh, enough, tough) đọc /f/; v đọc /v/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["mo<u>th</u>er", "wea<u>th</u>er", "<u>th</u>irsty", "fa<u>th</u>er"], "a": 2, "u": 1, "hint": "So sánh /θ/ (thank, think, three, both, month, birthday) và /ð/ (this, these, they, mother, father, weather, together). Đặt lưỡi giữa răng, thử xem dây thanh quản có rung không."}]}, {"id": "d27-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "My mother loves ___ meals for the family.", "o": ["cooking", "cooked", "cooks", "cook"], "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích love, động từ ở dạng nào? Nghĩa: nấu bữa ăn."}, {"s": "Linh is good ___ making paper flowers.", "o": ["on", "at", "in", "for"], "a": 1, "u": 1, "hint": "Cụm cố định: good + giới từ + V-ing (giỏi về). Nhớ giới từ đi với good khi nói về khả năng."}, {"s": "Nam ___ his homework every evening after dinner.", "o": ["does", "doing", "is do", "do"], "a": 0, "u": 1, "hint": "Có 'every evening': hiện tại đơn, chủ ngữ Nam (số ít). Cụm: do homework."}, {"s": "Do you like ___ a bath in winter?", "o": ["having", "to has", "have", "has"], "a": 0, "u": 1, "hint": "Sau 'like' (thích) động từ ở dạng nào? Cụm: have a bath."}, {"s": "Our cooking lesson ___ at 9 a.m. every Saturday.", "o": ["to start", "starting", "start", "starts"], "a": 3, "u": 1, "hint": "Lịch cố định 'every Saturday': hiện tại đơn, chủ ngữ 'lesson' (số ít)."}, {"s": "A ___ is a person who collects stamps.", "o": ["collect", "collector", "collecting", "collection"], "a": 1, "u": 1, "hint": "Danh từ chỉ người sưu tầm tem: thêm hậu tố chỉ người vào động từ 'collect'."}, {"s": "He doesn't have much free time, so he ___ go out often.", "o": ["isn't", "doesn't", "not", "don't"], "a": 1, "u": 1, "hint": "Phủ định hiện tại đơn với chủ ngữ He: dùng trợ động từ nào trước động từ nguyên mẫu?"}, {"s": "Tom ___ to music in his room now.", "o": ["listens", "listened", "is listening", "listen"], "a": 2, "u": 1, "hint": "Có 'now': thì hiện tại tiếp diễn."}, {"s": "– “What's your hobby?” – “___”", "o": ["Yes, I do.", "It's very old.", "I collect coins.", "I'm fine, thank you."], "a": 2, "u": 1, "hint": "Hỏi về sở thích 'What's your hobby?'. Chọn câu đáp nêu một sở thích."}, {"s": "Find the mistake: My father <u>hate</u> <u>getting</u> up <u>early</u> <u>on</u> Mondays.", "o": ["hate", "getting", "early", "on"], "a": 0, "u": 1, "hint": "Chủ ngữ My father (số ít), hiện tại đơn: kiểm tra động từ 'hate' đã chia đúng chưa."}]}, {"id": "d27-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "The bus (leave) ___ at 6.30 every day.", "a": 0, "u": 1, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật), dấu hiệu 'every'. Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["leaves", "leave", "leaving"], "c3": 1}, {"s": "Mai (take) ___ part in a clean-up activity last Sunday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["took", "take", "takes"], "c3": 1}, {"s": "My grandfather enjoys (grow) ___ flowers.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["growing", "grow", "grows"], "c3": 1}, {"s": "Where is Tom? He (swim) ___ in the pool now.", "a": 0, "u": 1, "hint": "Dấu hiệu 'now' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["is swimming", "swims", "swam"], "c3": 1}, {"s": "I (be) ___ at home two days ago.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('ago'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["was", "were", "is"], "c3": 1}, {"s": "The children (not watch) ___ TV now.", "a": 0, "u": 1, "hint": "Dấu hiệu 'now' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["are not watching", "are not watch", "do not watch"], "c3": 1}, {"s": "You shouldn't (stay) ___ up late.", "a": 0, "u": 2, "hint": "Sau should/shouldn't dùng động từ nguyên mẫu không có to.", "o": ["stay", "to stay", "staying"], "c3": 1}]}, {"id": "d27-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "She doesn't like ___ her room every day.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'dọn dẹp'.", "o": ["tidying", "tidy", "tidied"], "c3": 1}, {"s": "Does she like ___ a shower after dinner?", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'tắm (have a shower)'.", "o": ["having", "have", "had"], "c3": 1}, {"s": "Hannah loves ___ her friends once a week.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'gặp'.", "o": ["meeting", "meet", "met"], "c3": 1}, {"s": "Tom hates ___ his bike in the rain.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'cưỡi, đi (ngựa, xe)'.", "o": ["riding", "ride", "rode"], "c3": 1}, {"s": "My sister adores ___ songs in the school choir.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'hát'.", "o": ["singing", "sing", "sang"], "c3": 1}, {"s": "My father loves ___ breakfast for us.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'nấu ăn'.", "o": ["cooking", "cook", "cooked"], "c3": 1}, {"s": "Grandma enjoys ___ flowers and vegetables.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'trồng'.", "o": ["growing", "grow", "grew"], "c3": 1}, {"s": "He fancies ___ landscapes in his free time.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'vẽ (tranh sơn)'.", "o": ["painting", "paint", "painted"], "c3": 1}, {"s": "My brother likes ___ in the park every morning.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'chạy bộ'.", "o": ["jogging", "jog", "jogged"], "c3": 1}, {"s": "Uncle Ba loves ___ by the lake at weekends.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'câu cá'.", "o": ["fishing", "fish", "fished"], "c3": 1}], "box": ["fishing", "growing", "riding", "meeting", "cooking", "tidying", "having", "jogging", "singing", "painting"]}, {"id": "d27-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "When did Quan start cooking?", "o": ["When he was ten", "Last week", "Last year", "Two years ago"], "a": 2, "u": 1, "hint": "Tìm câu 'My hobby is cooking. I started it ...' để biết thời điểm bắt đầu."}, {"s": "Why did he cook the first dinner?", "o": ["There was no food.", "His mother was ill.", "It was a school project.", "His father asked him."], "a": 1, "u": 1, "hint": "Tìm cụm 'my mother was ill'."}, {"s": "Where does Quan find new dishes?", "o": ["At the market", "In a school club", "From his sister", "On the Internet"], "a": 3, "u": 1, "hint": "Tìm câu có 'try new dishes'."}, {"s": "What does Quan think about cooking?", "o": ["It is only for girls.", "It is difficult and boring.", "It takes too much time.", "It is useful for his family."], "a": 3, "u": 1, "hint": "Tìm câu cuối có 'I think cooking is useful because...'."}], "passage": "My name is Quan and I am fourteen. My hobby is cooking. I started it last year, when my mother was ill and I cooked dinner for the family for the first time. My father said it was delicious! Now I cook at weekends and try new dishes from the Internet. My sister often helps me wash the dishes. I think cooking is useful because it makes the whole family happy.", "ptitle": "My Hobby: Cooking"}, {"id": "d27-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["when", "why", "who", "where"], "a": 0, "u": 1, "hint": "'started this hobby ___ she was eleven': từ nối chỉ thời điểm."}, {"o": ["club", "coin", "model", "doll"], "a": 2, "u": 1, "hint": "'needs about a week to make a ___': vật mà Julie làm ra ở sở thích này."}, {"o": ["bus", "park", "shelf", "road"], "a": 2, "u": 1, "hint": "Mô hình đặt trên cái gì trong phòng ngủ? Mối liên hệ với 'another shelf' ở câu sau."}, {"o": ["yesterday", "never", "ago", "soon"], "a": 3, "u": 1, "hint": "'she needs another shelf ___': trạng từ chỉ thời gian ngắn tới (sắp tới)."}], "passage": "Julie likes making models. She started this hobby {1} she was eleven. She needs about a week to make a {2} . When it is ready, she puts it on a {3} in her bedroom. She now has thirty models, so she needs another shelf {4} ."}, {"id": "d27-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "Nam loves playing chess.", "a": 0, "u": 1, "hint": "Dùng be + tính từ + giới từ + V-ing để diễn đạt sở thích (fond of / keen on / interested in / crazy about). Chọn cụm cùng nghĩa 'thích', rồi giữ nguyên phần V-ing.", "o": ["Nam is keen on playing chess.", "Nam is keen on play chess.", "Nam are keen on playing chess."], "c3": 1}, {"s": "Lan eats lots of carrots. Lan eats lots of tomatoes.", "a": 0, "u": 2, "hint": "Gộp hai danh từ cùng được ăn bằng and, giữ một động từ và một cụm 'lots of'.", "o": ["Lan eats lots of carrots and tomatoes.", "Lan eats lots of carrots or tomatoes.", "Lan eats lots on carrots and tomatoes."], "c3": 1}, {"s": "Mai went to the shop because she wanted to buy some glue.", "a": 0, "u": 1, "hint": "Rút gọn 'because ... wanted to + V' thành mục đích: to + động từ nguyên mẫu, bỏ chủ ngữ và 'wanted'.", "o": ["Mai went to the shop to buy some glue.", "Mai went to shop to buy some glue.", "Mai went the shop to buy some glue."], "c3": 1}, {"s": "Mai donated old clothes last week.", "a": 0, "u": 3, "hint": "Chuyển câu khẳng định quá khứ thành phủ định: did not + động từ nguyên mẫu (động từ chính trở về dạng gốc).", "o": ["Mai did not donate old clothes last week.", "Mai did not donated old clothes last week.", "Mai not donated old clothes last week."], "c3": 1}, {"s": "Tom likes playing football best.", "a": 0, "u": 1, "hint": "Dùng cấu trúc: Tên người's favourite hobby is + V-ing (sở thích yêu thích nhất).", "o": ["Tom's favourite hobby is playing football.", "Tom's favourite hobby are playing football.", "Tom's favourite hobby playing football."], "c3": 1}]}, {"id": "d27-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "loves / my mother / cooking / for the family", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: My.", "o": ["My mother loves cooking for the family.", "My mother cooking loves for the family.", "Loves my mother cooking for the family."], "c3": 1}, {"s": "fond of / paper flowers / making / Linh / is", "a": 0, "u": 1, "hint": "Cấu trúc: S + be + tính từ + giới từ + V-ing. Câu bắt đầu bằng: Linh.", "o": ["Linh is fond of making paper flowers.", "Linh fond of is making paper flowers.", "Linh is making fond of paper flowers."], "c3": 1}, {"s": "doesn't / early / he / getting up / like", "a": 0, "u": 1, "hint": "Cấu trúc phủ định: S + doesn't/didn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: He.", "o": ["He doesn't like getting up early.", "He like doesn't getting up early.", "He doesn't getting up like early."], "c3": 1}, {"s": "at weekends / she / does / puzzles / often", "a": 0, "u": 1, "hint": "Trạng từ tần suất (never, often, always...) đứng trước động từ thường; thứ tự: S + trạng từ + V + O. Câu bắt đầu bằng: She.", "o": ["She often does puzzles at weekends.", "She does often puzzles at weekends.", "She often puzzles does at weekends."], "c3": 1}, {"s": "you / like / riding a horse / do", "a": 0, "u": 1, "hint": "Câu hỏi Yes/No ở hiện tại đơn: Do + chủ ngữ + động từ nguyên mẫu ...? Câu bắt đầu bằng: Do.", "o": ["Do you like riding a horse?", "Do you riding a horse like?", "Like you do riding a horse?"], "c3": 1}]}]}, {"id": "g7d28", "no": 28, "title": "Đề số 28", "acts": [{"id": "d28-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["danc<u>es</u>", "brush<u>es</u>", "pen<u>s</u>", "page<u>s</u>"], "a": 2, "u": 1, "hint": "Đuôi -s/-es đọc /s/ sau âm vô thanh (/p/, /t/, /k/, /f/), đọc /iz/ sau âm gió (/s/, /z/, /ʃ/, /tʃ/, /dʒ/), còn lại đọc /z/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>or</u>k", "<u>a</u>gain", "doct<u>or</u>", "moth<u>er</u>"], "a": 0, "u": 1, "hint": "So sánh âm /ɜː/ (như trong 'bird', 'nurse') và âm /ə/ (âm yếu, ngắn như ở cuối 'teacher', đầu 'about'). Đọc chậm từng từ rồi nghe âm gạch chân."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>ph</u>oto", "<u>ph</u>one", "lea<u>f</u>", "<u>v</u>ery"], "a": 3, "u": 1, "hint": "So sánh /f/ và /v/: f, ph và gh (trong laugh, enough, tough) đọc /f/; v đọc /v/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["mo<u>th</u>er", "<u>th</u>ick", "tee<u>th</u>", "<u>th</u>ink"], "a": 0, "u": 1, "hint": "So sánh /θ/ (thank, think, three, both, month, birthday) và /ð/ (this, these, they, mother, father, weather, together). Đặt lưỡi giữa răng, thử xem dây thanh quản có rung không."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>sh</u>e", "<u>s</u>o", "<u>s</u>ix", "<u>s</u>ong"], "a": 0, "u": 1, "hint": "So sánh /s/ (see, song, six) và /ʃ/ (she, show, shop, fish, wash). Chữ sh luôn đọc /ʃ/."}]}, {"id": "d28-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "You should drink ___ water every day.", "o": ["more", "most", "much", "many"], "a": 0, "u": 2, "hint": "Lượng nước nên uống: dùng dạng so sánh hơn trước danh từ không đếm được."}, {"s": "Teenagers need about eight hours of ___ every night.", "o": ["diet", "exercise", "sleep", "vitamins"], "a": 2, "u": 2, "hint": "Thanh thiếu niên cần ngủ khoảng tám giờ mỗi đêm: chọn danh từ chỉ việc nghỉ ngơi ban đêm."}, {"s": "If you stay up late, you ___ tired tomorrow.", "o": ["feeling", "will feel", "feel", "felt"], "a": 1, "u": 2, "hint": "Câu điều kiện loại 1: If + hiện tại đơn, mệnh đề chính dùng thì tương lai đơn."}, {"s": "She ___ eat meat because she is a vegetarian.", "o": ["don't", "didn't", "doesn't", "isn't"], "a": 2, "u": 2, "hint": "Chủ ngữ She (số ít), hiện tại đơn, phủ định: dùng trợ động từ nào? (cô ấy ăn chay)"}, {"s": "Regular exercise makes your heart and muscles ___ .", "o": ["strongly", "strengthen", "strong", "strength"], "a": 2, "u": 2, "hint": "Make + tân ngữ + tính từ: cần tính từ (không phải trạng từ hay danh từ)."}, {"s": "My father ___ his car every weekend.", "o": ["washes", "washing", "is wash", "wash"], "a": 0, "u": 1, "hint": "Có 'every weekend' và chủ ngữ my father (số ít): hiện tại đơn, động từ tận cùng -sh."}, {"s": "Meat and eggs are rich in ___ .", "o": ["salt", "sugar", "oil", "protein"], "a": 3, "u": 2, "hint": "Thịt và trứng giàu chất dinh dưỡng nào giúp cơ thể phát triển? Chọn chất đạm."}, {"s": "They ___ at home last night because it rained.", "o": ["staying", "stay", "stays", "stayed"], "a": 3, "u": 3, "hint": "Có 'last night': thì quá khứ đơn. Cụm: stay at home."}, {"s": "– “I have a headache.” – “___”", "o": ["It's very good.", "Thank you very much.", "You should take a rest.", "Yes, you do."], "a": 2, "u": 2, "hint": "Người nói bị đau đầu. Chọn lời khuyên phù hợp."}, {"s": "Find the mistake: You <u>should</u> <u>to</u> eat <u>more</u> <u>fruit</u>.", "o": ["should", "to", "more", "fruit"], "a": 1, "u": 2, "hint": "Sau 'should' động từ ở dạng nguyên mẫu. Tìm từ thừa trong cấu trúc."}]}, {"id": "d28-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "He always (do) ___ his homework before dinner.", "a": 0, "u": 1, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật), dấu hiệu 'always'. Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["does", "do", "doing"], "c3": 1}, {"s": "He (give) ___ his old bike to a poor boy last year.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["gave", "give", "gives"], "c3": 1}, {"s": "I don't like (eat) ___ fast food.", "a": 0, "u": 2, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["eating", "eat", "eats"], "c3": 1}, {"s": "The students (help) ___ the old man cross the road now.", "a": 0, "u": 3, "hint": "Dấu hiệu 'now' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["are helping", "help", "helped"], "c3": 1}, {"s": "They (be) ___ in the countryside last summer.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["were", "was", "are"], "c3": 1}, {"s": "She (not drink) ___ soft drinks.", "a": 0, "u": 2, "hint": "Chủ ngữ số ít, hiện tại đơn phủ định: dùng does not + động từ nguyên mẫu.", "o": ["does not drink", "do not drink", "does not drinks"], "c3": 1}, {"s": "My uncle took an aspirin (stop) ___ his headache.", "a": 0, "u": 2, "hint": "Chỉ mục đích (để làm gì): dùng to + động từ nguyên mẫu.", "o": ["to stop", "stopping", "stop"], "c3": 1}]}, {"id": "d28-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "Playing sports is good for your ___ .", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'sức khoẻ' phù hợp với chỗ trống.", "o": ["health", "exercise", "outdoor"], "c3": 1}, {"s": "Put on some ___ before you go to the beach.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'kem chống nắng' phù hợp với chỗ trống.", "o": ["suncream", "exercise", "outdoor"], "c3": 1}, {"s": "Teenagers often get ___ , so they should wash their faces.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'mụn trứng cá' phù hợp với chỗ trống.", "o": ["acne", "outdoor", "health"], "c3": 1}, {"s": "Carrots and tomatoes are coloured ___ .", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'rau củ' phù hợp với chỗ trống.", "o": ["vegetables", "fit", "outdoor"], "c3": 1}, {"s": "You will get ___ if you stay in the sun too long.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'cháy nắng' phù hợp với chỗ trống.", "o": ["sunburn", "outdoor", "diet"], "c3": 1}, {"s": "Boating and cycling are ___ activities.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'ngoài trời' phù hợp với chỗ trống.", "o": ["outdoor", "diet", "acne"], "c3": 1}, {"s": "She does morning ___ every day.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'tập thể dục' phù hợp với chỗ trống.", "o": ["exercise", "acne", "vegetables"], "c3": 1}, {"s": "My cousin runs every day to keep ___ .", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'cân đối, khoẻ' phù hợp với chỗ trống.", "o": ["fit", "vitamins", "diet"], "c3": 1}, {"s": "Oranges are full of ___ , especially vitamin C.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'vi-ta-min' phù hợp với chỗ trống.", "o": ["vitamins", "fit", "outdoor"], "c3": 1}, {"s": "He is on a ___ , so he doesn't eat sweets.", "a": 0, "u": 2, "hint": "Tìm trong khung từ nghĩa 'chế độ ăn kiêng' phù hợp với chỗ trống.", "o": ["diet", "exercise", "outdoor"], "c3": 1}], "box": ["outdoor", "fit", "health", "sunburn", "vegetables", "exercise", "diet", "vitamins", "acne", "suncream"]}, {"id": "d28-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "How much sleep do teenagers need?", "o": ["Two hours", "Eight to nine hours", "Five hours", "Twelve hours"], "a": 1, "u": 1, "hint": "Tìm câu đầu có 'eight to nine hours'."}, {"s": "What happens if you sleep too little?", "o": ["You get acne.", "You become taller.", "You feel tired.", "You get sunburn."], "a": 2, "u": 1, "hint": "Tìm câu bắt đầu bằng 'If you sleep too little'."}, {"s": "What should you not do late at night?", "o": ["Use a phone or computer", "Drink water", "Read a book", "Brush your teeth"], "a": 0, "u": 1, "hint": "Tìm câu 'You should not use ...' ở giữa đoạn văn."}, {"s": "What is the main idea of the passage?", "o": ["School starts too early.", "Soft drinks are tasty.", "Phones are useful.", "Sleep helps teenagers stay healthy."], "a": 3, "u": 1, "hint": "Câu ý chính: bao quát cả đoạn văn (ngủ đủ giúp teen thế nào)."}], "passage": "Sleep is very important for teenagers. They need about eight to nine hours of sleep every night. If you sleep too little, you feel tired and cannot concentrate at school. You should not use your phone or computer late at night. It is also a good idea to avoid soft drinks in the evening and to go to bed at the same time every day.", "ptitle": "Good Sleep, Good Health"}, {"id": "d28-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["diet", "show", "bike", "club"], "a": 0, "u": 2, "hint": "Bữa ăn cân bằng: danh từ chỉ chế độ ăn uống, nói về 'a balanced ___'."}, {"o": ["good", "fresh", "bad", "useful"], "a": 2, "u": 2, "hint": "Đồ ăn nhanh ăn nhiều thì sao đối với sức khoẻ? Chọn tính từ tiêu cực."}, {"o": ["sleep late", "stay up", "exercise", "skip lunch"], "a": 2, "u": 2, "hint": "'to keep fit': việc nên làm mỗi ngày để giữ dáng."}, {"o": ["ill", "healthy", "tired", "lazy"], "a": 1, "u": 2, "hint": "'you will be ___ and happy': kết quả của lối sống tốt."}], "passage": "Doctors say that we should eat a balanced {1} . You should have fruit, vegetables, rice and a little meat or fish. Don't eat too much fast food, because it is {2} for you. You should also {3} every day to keep fit. If you follow this advice, you will be {4} and happy."}, {"id": "d28-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "It is fun to play board games with friends.", "a": 0, "u": 1, "hint": "Dùng V-ing làm chủ ngữ: V-ing + ... + is + tính từ, thay cho cấu trúc 'It is + tính từ + to V'.", "o": ["Playing board games with friends is fun.", "Playing board games with friends are fun.", "Playing board games with friends fun."], "c3": 1}, {"s": "Drinking more water is a good idea.", "a": 0, "u": 2, "hint": "Dùng should (nên) hoặc shouldn't (không nên) + động từ nguyên mẫu để nói lời khuyên, thay cho 'It is a (not) good idea / not healthy'.", "o": ["You should drink more water.", "You should to drink more water.", "You should drinking more water."], "c3": 1}, {"s": "My brother finds collecting stamps exciting.", "a": 0, "u": 1, "hint": "Chuyển 'find + V-ing + tính từ' thành 'think that + V-ing + is + tính từ'. Chú ý chủ ngữ số ít nên dùng is.", "o": ["My brother thinks that collecting stamps is exciting.", "My brother thinks that collecting stamps are exciting.", "My brother thinks that collecting stamps exciting."], "c3": 1}, {"s": "Nam didn't go out. Mai didn't go out.", "a": 0, "u": 2, "hint": "Cấu trúc Neither A nor B: câu có nghĩa phủ định nhưng động từ ở dạng khẳng định, chia theo thì quá khứ.", "o": ["Neither Nam nor Mai went out.", "Neither Nam or Mai went out.", "Neither Nam nor Mai didn't go out."], "c3": 1}, {"s": "You must wear a hat or you will get sunburn.", "a": 0, "u": 2, "hint": "Dùng câu điều kiện loại 1: If + hiện tại đơn, S + will + V. Nếu câu gốc có 'must ... or' thì mệnh đề If ở dạng phủ định.", "o": ["If you don't wear a hat, you will get sunburn.", "If you don't wear a hat, you will gets sunburn.", "If you will don't wear a hat, you will get sunburn."], "c3": 1}]}, {"id": "d28-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "enough sleep / should / you / get", "a": 0, "u": 1, "hint": "Cấu trúc: S + should/shouldn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: You.", "o": ["You should get enough sleep.", "You get should enough sleep.", "You should enough sleep get."], "c3": 1}, {"s": "goes / every night / to bed / he / at ten", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: He.", "o": ["He goes to bed at ten every night.", "He to bed goes at ten every night.", "Goes he to bed at ten every night."], "c3": 1}, {"s": "need / the elderly / healthy food", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: The.", "o": ["The elderly need healthy food.", "The elderly healthy food need.", "Need the elderly healthy food."], "c3": 1}, {"s": "fast food / she / never / eats", "a": 0, "u": 1, "hint": "Trạng từ tần suất (never, often, always...) đứng trước động từ thường; thứ tự: S + trạng từ + V + O. Câu bắt đầu bằng: She.", "o": ["She never eats fast food.", "She eats never fast food.", "She never fast food eats."], "c3": 1}, {"s": "should / avoid / too much sugar / we", "a": 0, "u": 1, "hint": "Cấu trúc: S + should/shouldn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: We.", "o": ["We should avoid too much sugar.", "We avoid should too much sugar.", "We should too much sugar avoid."], "c3": 1}]}]}, {"id": "g7d29", "no": 29, "title": "Đề số 29", "acts": [{"id": "d29-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["g<u>ir</u>l", "<u>a</u>gain", "cam<u>e</u>ra", "doct<u>or</u>"], "a": 0, "u": 1, "hint": "So sánh âm /ɜː/ (như trong 'bird', 'nurse') và âm /ə/ (âm yếu, ngắn như ở cuối 'teacher', đầu 'about'). Đọc chậm từng từ rồi nghe âm gạch chân."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["lau<u>gh</u>", "enou<u>gh</u>", "lea<u>f</u>", "<u>v</u>ery"], "a": 3, "u": 1, "hint": "So sánh /f/ và /v/: f, ph và gh (trong laugh, enough, tough) đọc /f/; v đọc /v/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["mo<u>th</u>er", "<u>th</u>in", "<u>th</u>ank", "mon<u>th</u>"], "a": 0, "u": 1, "hint": "So sánh /θ/ (thank, think, three, both, month, birthday) và /ð/ (this, these, they, mother, father, weather, together). Đặt lưỡi giữa răng, thử xem dây thanh quản có rung không."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>sh</u>ort", "<u>sh</u>ow", "<u>s</u>o", "<u>sh</u>e"], "a": 2, "u": 1, "hint": "So sánh /s/ (see, song, six) và /ʃ/ (she, show, shop, fish, wash). Chữ sh luôn đọc /ʃ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["want<u>ed</u>", "plann<u>ed</u>", "lov<u>ed</u>", "open<u>ed</u>"], "a": 0, "u": 1, "hint": "Đuôi -ed đọc /t/ sau âm vô thanh (như /k/, /s/, /f/, /ʃ/, /p/), đọc /id/ sau âm /t/ và /d/, còn lại đọc /d/. Hãy đọc thầm động từ gốc rồi xét âm cuối."}]}, {"id": "d29-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "The students collected plastic bottles ___ recycling last week.", "o": ["of", "on", "for", "at"], "a": 2, "u": 3, "hint": "Collect plastic bottles ___ recycling: chọn giới từ chỉ mục đích."}, {"s": "My brother ___ a poster for the clean-up activity yesterday.", "o": ["making", "make", "makes", "made"], "a": 3, "u": 3, "hint": "Có 'yesterday': thì quá khứ đơn. Động từ 'make' có dạng quá khứ bất quy tắc."}, {"s": "People should ___ used paper to protect the environment.", "o": ["tutor", "recycle", "donate", "water"], "a": 1, "u": 3, "hint": "Để bảo vệ môi trường, nên làm gì với giấy đã dùng? Chọn động từ 'tái chế'."}, {"s": "Hoa ___ in the school garden now.", "o": ["works", "work", "worked", "is working"], "a": 3, "u": 3, "hint": "Có 'now': thì hiện tại tiếp diễn, chủ ngữ Hoa (số ít)."}, {"s": "The volunteers ___ the street clean after the storm.", "o": ["cleaning", "cleaned", "clean", "cleans"], "a": 1, "u": 3, "hint": "Có 'after the storm' ở quá khứ. Cấu trúc: động từ quá khứ + the street + tính từ."}, {"s": "Linh and I ___ in the same club last year.", "o": ["be", "were", "are", "was"], "a": 1, "u": 3, "hint": "Có 'last year' và chủ ngữ Linh and I (số nhiều): thì quá khứ của 'to be'."}, {"s": "There ___ a lot of rubbish near the lake yesterday.", "o": ["be", "is", "were", "was"], "a": 3, "u": 3, "hint": "'There' + to be ở quá khứ: danh từ 'a lot of rubbish' là không đếm được, xét dạng của 'be'."}, {"s": "We exchanged used paper ___ notebooks.", "o": ["in", "at", "for", "to"], "a": 2, "u": 3, "hint": "Cụm: exchange A ___ B (đổi A lấy B). Chọn giới từ phù hợp."}, {"s": "– “Did you take part in the clean-up last Sunday?” – “___”", "o": ["No, I don't.", "Yes, I did.", "Yes, I was.", "Yes, I will."], "a": 1, "u": 3, "hint": "Câu hỏi quá khứ với 'Did you...?': câu đáp ngắn dùng trợ động từ nào?"}, {"s": "Find the mistake: My friends <u>and</u> I <u>pick</u> up litter <u>yesterday</u> <u>morning</u>.", "o": ["and", "pick", "yesterday", "morning"], "a": 1, "u": 3, "hint": "Có 'yesterday morning': động từ phải ở thì quá khứ đơn. Tìm động từ chia sai."}]}, {"id": "d29-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "My mother often (cook) ___ rice and vegetables for lunch.", "a": 0, "u": 2, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật), dấu hiệu 'often'. Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["cooks", "cook", "cooking"], "c3": 1}, {"s": "We (see) ___ a good film last night.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["saw", "see", "sees"], "c3": 1}, {"s": "She detests (wait) ___ for the bus.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["waiting", "wait", "waits"], "c3": 1}, {"s": "My brother (build) ___ a dollhouse at the moment.", "a": 0, "u": 1, "hint": "Dấu hiệu 'at the moment' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["is building", "builds", "built"], "c3": 1}, {"s": "There (be) ___ many people at the festival yesterday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["were", "was", "are"], "c3": 1}, {"s": "We (not have) ___ much time last night.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): phủ định quá khứ đơn dùng did not + động từ nguyên mẫu.", "o": ["did not have", "did not had", "does not have"], "c3": 1}, {"s": "He wants (collect) ___ stamps from many countries.", "a": 0, "u": 1, "hint": "Sau want dùng to + động từ nguyên mẫu.", "o": ["to collect", "collecting", "collect"], "c3": 1}]}, {"id": "d29-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "It ___ a sunny day last Saturday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'thì, là (be)'. Đây là động từ bất quy tắc.", "o": ["was", "is", "be"], "c3": 1}, {"s": "We ___ to the nursing home by bus last Sunday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'đi'. Đây là động từ bất quy tắc.", "o": ["went", "go", "going"], "c3": 1}, {"s": "We ___ lunch with the old people there.", "a": 0, "u": 3, "hint": "Câu ở thì quá khứ đơn. Tìm trong khung động từ nghĩa 'có, ăn (have)'. Đây là động từ bất quy tắc.", "o": ["had", "have", "having"], "c3": 1}, {"s": "Mai ___ the cleaning while I cooked.", "a": 0, "u": 3, "hint": "Câu ở thì quá khứ đơn. Tìm trong khung động từ nghĩa 'làm'. Đây là động từ bất quy tắc.", "o": ["did", "do", "doing"], "c3": 1}, {"s": "I ___ very tired after the long walk.", "a": 0, "u": 3, "hint": "Câu ở thì quá khứ đơn. Tìm trong khung động từ nghĩa 'trở nên'. Đây là động từ bất quy tắc.", "o": ["got", "get", "getting"], "c3": 1}, {"s": "The old man ___ “Thank you very much”.", "a": 0, "u": 3, "hint": "Câu ở thì quá khứ đơn. Tìm trong khung động từ nghĩa 'nói'. Đây là động từ bất quy tắc.", "o": ["said", "say", "saying"], "c3": 1}, {"s": "Some students ___ late for the trip yesterday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'đến'. Đây là động từ bất quy tắc.", "o": ["came", "come", "coming"], "c3": 1}, {"s": "They ___ a lost wallet in the park.", "a": 0, "u": 3, "hint": "Câu ở thì quá khứ đơn. Tìm trong khung động từ nghĩa 'tìm thấy'. Đây là động từ bất quy tắc.", "o": ["found", "find", "finding"], "c3": 1}, {"s": "Lan ___ her teacher at the bus stop this morning.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('this morning'): dùng quá khứ đơn. Tìm trong khung động từ nghĩa 'gặp'. Đây là động từ bất quy tắc.", "o": ["met", "meet", "meeting"], "c3": 1}, {"s": "We ___ a beautiful rainbow after the rain.", "a": 0, "u": 3, "hint": "Câu ở thì quá khứ đơn. Tìm trong khung động từ nghĩa 'nhìn thấy'. Đây là động từ bất quy tắc.", "o": ["saw", "see", "seeing"], "c3": 1}], "box": ["did", "saw", "found", "was", "had", "came", "got", "said", "went", "met"]}, {"id": "d29-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "When does the Green Club clean the street?", "o": ["On Saturday mornings", "On Sunday afternoons", "On Mondays", "Every evening"], "a": 0, "u": 1, "hint": "Tìm câu 'Every Saturday morning' ở đầu đoạn văn."}, {"s": "What did the members plant last month?", "o": ["Fifty trees", "Vegetables", "Flowers", "Bamboo"], "a": 0, "u": 1, "hint": "Tìm câu có 'planted fifty trees' ở gần cuối."}, {"s": "Who can join the club?", "o": ["Only teachers", "Anyone", "Only leaders", "Only girls"], "a": 1, "u": 1, "hint": "Tìm câu có 'anyone can join'."}, {"s": "Why do many students want to join?", "o": ["They think the work is useful and fun.", "They have no homework.", "The club gives money.", "It is near their homes."], "a": 0, "u": 1, "hint": "Tìm câu cuối có 'because they think...'."}], "passage": "Our school has a Green Club. Every Saturday morning, its members clean the street near the school and pick up litter. They also collect used paper and plastic bottles for recycling. Last month, they planted fifty trees along the road. The club leader says anyone can join, and the activities are free. Many students want to be members because they think the work is useful and fun.", "ptitle": "Green Club"}, {"id": "d29-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["environment", "hobby", "diet", "skin"], "a": 0, "u": 3, "hint": "Tái chế để bảo vệ cái gì? Danh từ chỉ thiên nhiên xung quanh."}, {"o": ["plant", "water", "exchange", "tutor"], "a": 2, "u": 3, "hint": "Đổi giấy cũ lấy sổ mới: động từ nghĩa 'trao đổi'."}, {"o": ["too", "so", "but", "or"], "a": 0, "u": 3, "hint": "Trong câu có 'new things ___': từ thêm vào mang nghĩa 'cũng'."}, {"o": ["from", "when", "as", "than"], "a": 3, "u": 3, "hint": "'cleaner ___ before': cấu trúc so sánh hơn, từ đi sau tính từ so sánh."}], "passage": "Recycling is a good way to protect our {1} . We can collect used paper and {2} it for notebooks. Plastic bottles can be changed into new things {3} . If everyone recycles, our town will be cleaner {4} before."}, {"id": "d29-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "Hoa likes cooking very much.", "a": 0, "u": 1, "hint": "Dùng be + tính từ + giới từ + V-ing để diễn đạt sở thích (fond of / keen on / interested in / crazy about). Chọn cụm cùng nghĩa 'thích', rồi giữ nguyên phần V-ing.", "o": ["Hoa is fond of cooking.", "Hoa is fond of cook.", "Hoa are fond of cooking."], "c3": 1}, {"s": "The car is new. The car is comfortable.", "a": 0, "u": 2, "hint": "Nối hai tính từ bằng and, chỉ dùng một chủ ngữ và một động từ be.", "o": ["The car is new and comfortable.", "The car are new and comfortable.", "The car is new or comfortable."], "c3": 1}, {"s": "They collect used paper because they want to recycle it.", "a": 0, "u": 3, "hint": "Rút gọn 'because ... wanted to + V' thành mục đích: to + động từ nguyên mẫu, bỏ chủ ngữ và 'wanted'.", "o": ["They collect used paper to recycle it.", "They collect used paper to recycling it.", "They collect used paper recycle it."], "c3": 1}, {"s": "The students cleaned the street last weekend.", "a": 0, "u": 3, "hint": "Chuyển thành câu hỏi Yes/No ở quá khứ: Did + chủ ngữ + động từ nguyên mẫu ...?", "o": ["Did the students clean the street last weekend?", "Did the students cleaned the street last weekend?", "Did students clean the street last weekend?"], "c3": 1}, {"s": "My mother loves singing very much.", "a": 0, "u": 1, "hint": "Thay 'like' (hoặc 'doesn't like') bằng động từ chỉ sở thích đã cho, giữ nguyên V-ing sau nó.", "o": ["My mother adores singing.", "My mother adores sing.", "My mother adore singing."], "c3": 1}]}, {"id": "d29-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "cleaned / the street / the volunteers / yesterday", "a": 0, "u": 1, "hint": "Câu ở thì quá khứ đơn: S + V-ed/V2 + O + nơi chốn + thời gian (cụm thời gian có thể ở đầu hoặc cuối câu). Câu bắt đầu bằng: The.", "o": ["The volunteers cleaned the street yesterday.", "The volunteers the street cleaned yesterday.", "Cleaned the volunteers the street yesterday."], "c3": 1}, {"s": "for notebooks / we / exchanged / used paper", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: We.", "o": ["We exchanged used paper for notebooks.", "We used paper exchanged for notebooks.", "Exchanged we used paper for notebooks."], "c3": 1}, {"s": "planted / last month / they / fifty trees", "a": 0, "u": 1, "hint": "Câu ở thì quá khứ đơn: S + V-ed/V2 + O + nơi chốn + thời gian (cụm thời gian có thể ở đầu hoặc cuối câu). Câu bắt đầu bằng: They.", "o": ["They planted fifty trees last month.", "They fifty trees planted last month.", "Planted they fifty trees last month."], "c3": 1}, {"s": "yesterday / I / didn't / him / see", "a": 0, "u": 1, "hint": "Cấu trúc phủ định: S + doesn't/didn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: I.", "o": ["I didn't see him yesterday.", "I see didn't him yesterday.", "I didn't him see yesterday."], "c3": 1}, {"s": "should / students / plastic bottles / recycle", "a": 0, "u": 1, "hint": "Cấu trúc: S + should/shouldn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: Students.", "o": ["Students should recycle plastic bottles.", "Students recycle should plastic bottles.", "Students should plastic bottles recycle."], "c3": 1}]}]}, {"id": "g7d30", "no": 30, "title": "Đề số 30", "acts": [{"id": "d30-I", "part": "I", "title": "Phần I", "instr": "Find the word which has a different sound in the part underlined.", "type": "choice", "start": 1, "huong": "", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["gi<u>v</u>e", "mo<u>v</u>e", "<u>v</u>oice", "<u>f</u>ood"], "a": 3, "u": 1, "hint": "So sánh /f/ và /v/: f, ph và gh (trong laugh, enough, tough) đọc /f/; v đọc /v/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>th</u>ese", "mo<u>th</u>er", "wea<u>th</u>er", "<u>th</u>in"], "a": 3, "u": 1, "hint": "So sánh /θ/ (thank, think, three, both, month, birthday) và /ð/ (this, these, they, mother, father, weather, together). Đặt lưỡi giữa răng, thử xem dây thanh quản có rung không."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>s</u>o", "wa<u>sh</u>", "<u>s</u>ee", "<u>s</u>ong"], "a": 1, "u": 1, "hint": "So sánh /s/ (see, song, six) và /ʃ/ (she, show, shop, fish, wash). Chữ sh luôn đọc /ʃ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["kiss<u>ed</u>", "fix<u>ed</u>", "danc<u>ed</u>", "want<u>ed</u>"], "a": 3, "u": 1, "hint": "Đuôi -ed đọc /t/ sau âm vô thanh (như /k/, /s/, /f/, /ʃ/, /p/), đọc /id/ sau âm /t/ và /d/, còn lại đọc /d/. Hãy đọc thầm động từ gốc rồi xét âm cuối."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["book<u>s</u>", "help<u>s</u>", "bag<u>s</u>", "laugh<u>s</u>"], "a": 2, "u": 1, "hint": "Đuôi -s/-es đọc /s/ sau âm vô thanh (/p/, /t/, /k/, /f/), đọc /iz/ sau âm gió (/s/, /z/, /ʃ/, /tʃ/, /dʒ/), còn lại đọc /z/."}]}, {"id": "d30-II", "part": "II", "title": "Phần II", "instr": "Circle the best option (A, B, C or D) to fill in the gaps.", "type": "choice", "start": 6, "huong": "", "items": [{"s": "Our English club ___ every Friday afternoon.", "o": ["meeting", "meets", "met", "meet"], "a": 1, "u": 1, "hint": "Lịch sinh hoạt 'every Friday afternoon': hiện tại đơn, chủ ngữ 'club' (số ít)."}, {"s": "Mai is crazy ___ collecting key rings.", "o": ["about", "on", "of", "in"], "a": 0, "u": 1, "hint": "Cụm cố định: crazy + giới từ + V-ing (mê). Nhớ giới từ đi với crazy."}, {"s": "My cousin ___ judo at the sports club on Saturdays.", "o": ["does", "goes", "plays", "do"], "a": 0, "u": 1, "hint": "Judo đi với động từ nào? Chọn động từ dùng cho môn võ (do, play, go)."}, {"s": "I ___ cartoons on TV last night.", "o": ["watch", "watched", "watches", "watching"], "a": 1, "u": 1, "hint": "Có 'last night': thì quá khứ đơn của 'watch'."}, {"s": "Collecting coins is Nam's favourite ___ .", "o": ["hospital", "hobby", "habit", "homework"], "a": 1, "u": 1, "hint": "Sưu tầm tiền xu là điều Nam thích nhất: chọn danh từ chỉ sở thích."}, {"s": "How ___ is it from your house to the club? – About two kilometres.", "o": ["much", "often", "long", "far"], "a": 3, "u": 1, "hint": "Đáp 'About two kilometres' (khoảng hai ki-lô-mét) cho biết câu hỏi về khoảng cách."}, {"s": "My sister likes ___ models of old houses.", "o": ["made", "make", "to makes", "making"], "a": 3, "u": 1, "hint": "Sau động từ chỉ sở thích like, động từ ở dạng nào? Nghĩa: làm mô hình."}, {"s": "If it rains, we ___ in the club room.", "o": ["will stay", "are staying", "stay", "stayed"], "a": 0, "u": 3, "hint": "Câu điều kiện loại 1: If + hiện tại đơn, mệnh đề chính dùng thì tương lai đơn."}, {"s": "– “Do you find collecting stamps interesting?” – “___”", "o": ["Yes, I am.", "Yes, I do.", "Yes, it is.", "No, I haven't."], "a": 1, "u": 1, "hint": "Câu hỏi 'Do you find ... interesting?'. Câu đáp ngắn dùng trợ động từ trùng với câu hỏi."}, {"s": "Find the mistake: Lan <u>likes</u> <u>make</u> <u>paper</u> flowers <u>very much</u>.", "o": ["likes", "make", "paper", "very much"], "a": 1, "u": 1, "hint": "Sau 'like' động từ ở dạng nào? Tìm động từ để sai dạng."}]}, {"id": "d30-III", "part": "III", "title": "Phần III", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "", "items": [{"s": "Tom (fix) ___ his bike every Sunday.", "a": 0, "u": 1, "hint": "Thì hiện tại đơn (diễn tả thói quen/sự thật), dấu hiệu 'every'. Chủ ngữ số ít thì thêm -s/-es (chú ý động từ tận cùng -y, -ch, -sh, -o).", "o": ["fixes", "fix", "fixing"], "c3": 1}, {"s": "The volunteers (help) ___ the elderly last weekend.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ đơn. Chú ý động từ bất quy tắc, và động từ có quy tắc thì thêm -ed.", "o": ["helped", "help", "helps"], "c3": 1}, {"s": "Tom likes (take) ___ photos of animals.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing; chú ý quy tắc thêm -ing (bỏ e, gấp đôi phụ âm).", "o": ["taking", "take", "takes"], "c3": 1}, {"s": "Be quiet! The baby (sleep) ___ .", "a": 0, "u": 1, "hint": "Dấu hiệu 'Be quiet!' cho biết hành động đang diễn ra: dùng thì hiện tại tiếp diễn (am/is/are + V-ing).", "o": ["is sleeping", "sleeps", "slept"], "c3": 1}, {"s": "Mr Hung (be) ___ a volunteer last year.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('last'): dùng quá khứ của be. Chủ ngữ số ít (I, he, she, it) dùng một dạng, chủ ngữ số nhiều (we, you, they) dùng dạng còn lại.", "o": ["was", "were", "is"], "c3": 1}, {"s": "My father (not use) ___ a computer yesterday.", "a": 0, "u": 3, "hint": "Dấu hiệu quá khứ ('yesterday'): phủ định quá khứ đơn dùng did not + động từ nguyên mẫu.", "o": ["did not use", "did not used", "does not use"], "c3": 1}, {"s": "If you (study) ___ hard, you will pass the exam.", "a": 0, "u": 3, "hint": "Mệnh đề If trong câu điều kiện loại 1 dùng thì hiện tại đơn (không dùng will); chủ ngữ you/it xác định dạng động từ.", "o": ["study", "will study", "studied"], "c3": 1}]}, {"id": "d30-IV", "part": "IV", "title": "Phần IV", "instr": "Choose the correct word (A, B or C) to complete each sentence. The words in the box can help you.", "type": "choice", "start": 23, "huong": "", "items": [{"s": "He dislikes ___ for the bus in the cold.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'chờ'.", "o": ["waiting", "wait", "waited"], "c3": 1}, {"s": "My sister enjoys ___ stories for the school magazine.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'viết'.", "o": ["writing", "write", "wrote"], "c3": 1}, {"s": "I don't mind ___ for my exams at night.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'học'.", "o": ["studying", "study", "studied"], "c3": 1}, {"s": "Mai hates ___ the floor every day.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'lau dọn'.", "o": ["cleaning", "clean", "cleaned"], "c3": 1}, {"s": "The boys love ___ the ducks by the pond.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'cho ăn'.", "o": ["feeding", "feed", "fed"], "c3": 1}, {"s": "Do you fancy ___ your friends tonight?", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'gọi điện'.", "o": ["calling", "call", "called"], "c3": 1}, {"s": "They adore ___ sandcastles on the beach.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'xây, làm (mô hình)'.", "o": ["building", "build", "built"], "c3": 1}, {"s": "My parents like ___ to new places every summer.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'đi du lịch'.", "o": ["travelling", "travel", "travelled"], "c3": 1}, {"s": "Hoa detests ___ vegetables at the market; she is too shy.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'bán'.", "o": ["selling", "sell", "sold"], "c3": 1}, {"s": "Tom likes ___ cartoons of his teachers.", "a": 0, "u": 1, "hint": "Sau động từ chỉ sở thích (like, love, hate, enjoy, adore, fancy, dislike, detest) dùng V-ing. Tìm trong khung động từ ở dạng V-ing có nghĩa 'vẽ'.", "o": ["drawing", "draw", "drew"], "c3": 1}], "box": ["cleaning", "building", "travelling", "studying", "writing", "calling", "drawing", "waiting", "feeding", "selling"]}, {"id": "d30-V", "part": "V", "title": "Phần V", "instr": "Read the following passage and choose the best answers for the following questions.", "type": "choice", "start": 33, "huong": "", "items": [{"s": "How often does the club meet?", "o": ["Once a year", "Every day", "Twice a month", "Twice a week"], "a": 2, "u": 1, "hint": "Tìm câu có 'twice a month'."}, {"s": "What do the members do for the exhibition?", "o": ["They paint pictures.", "They sell cameras.", "They write stories.", "They choose the best photos."], "a": 3, "u": 1, "hint": "Tìm câu 'Each member takes photos... then we choose'."}, {"s": "What was the writer like at first?", "o": ["Afraid of animals", "Too shy to join", "Very good at photography", "Not good at taking photos"], "a": 3, "u": 1, "hint": "Tìm câu bắt đầu bằng 'At first'."}, {"s": "What does the writer think about the hobby?", "o": ["It is only for adults.", "It is expensive.", "It is difficult and boring.", "It is fun and creative."], "a": 3, "u": 1, "hint": "Tìm câu cuối có 'both ... and' để biết người viết nghĩ gì về sở thích."}], "passage": "Last year, I joined the photography club at my school. We have twenty members, and we meet twice a month. Each member takes photos of the school and the town, and then we choose the best ones for an exhibition. At first, I was not good at taking photos. Now I can take pictures of animals and flowers very well, so I think this hobby is both fun and creative.", "ptitle": "The Photography Club"}, {"id": "d30-VI", "part": "VI", "title": "Phần VI", "instr": "Choose the word which best fits each gap.", "type": "pchoice", "start": 37, "huong": "", "items": [{"o": ["to collects", "collected", "collecting", "collect"], "a": 2, "u": 1, "hint": "'Some like ___ stamps': sau like dùng dạng động từ nào?"}, {"o": ["played", "playing", "play", "plays"], "a": 1, "u": 1, "hint": "'keen on ___ board games': sau giới từ dùng dạng động từ nào?"}, {"o": ["than", "before", "because", "after"], "a": 3, "u": 1, "hint": "'help us relax ___ study': từ nối chỉ thứ tự thời gian (thư giãn sau khi học)."}, {"o": ["rooms", "schools", "friends", "stamps"], "a": 2, "u": 1, "hint": "'make new ___': người mà bạn kết giao qua sở thích."}], "passage": "Many teenagers have interesting hobbies. Some like {1} stamps, while others are keen on {2} board games. Hobbies help us relax {3} study. They also help us make new {4} ."}, {"id": "d30-VII", "part": "VII", "title": "Phần VII", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 41, "huong": "", "items": [{"s": "It is dangerous to swim in this river.", "a": 0, "u": 2, "hint": "Dùng V-ing làm chủ ngữ: V-ing + ... + is + tính từ, thay cho cấu trúc 'It is + tính từ + to V'.", "o": ["Swimming in this river is dangerous.", "Swimming in this river are dangerous.", "Swimming on this river is dangerous."], "c3": 1}, {"s": "It is not healthy to skip breakfast.", "a": 0, "u": 2, "hint": "Dùng should (nên) hoặc shouldn't (không nên) + động từ nguyên mẫu để nói lời khuyên, thay cho 'It is a (not) good idea / not healthy'.", "o": ["You shouldn't skip breakfast.", "You shouldn't to skip breakfast.", "You shouldn't skipping breakfast."], "c3": 1}, {"s": "Do you find cooking easy?", "a": 0, "u": 1, "hint": "Chuyển 'find + V-ing + tính từ' thành 'think that + V-ing + is + tính từ'. Chú ý chủ ngữ số ít nên dùng is.", "o": ["Do you think that cooking is easy?", "Do you think that cooking are easy?", "Do you think that cooking easy?"], "c3": 1}, {"s": "Tom likes football. His brother likes football.", "a": 0, "u": 2, "hint": "Cấu trúc Both A and B + động từ số nhiều; danh từ cuối câu để ở số nhiều.", "o": ["Both Tom and his brother like football.", "Both Tom and his brother likes football.", "Both Tom or his brother like football."], "c3": 1}, {"s": "Study hard and you will pass the test.", "a": 0, "u": 2, "hint": "Dùng câu điều kiện loại 1: If + hiện tại đơn, S + will + V. Nếu câu gốc có 'must ... or' thì mệnh đề If ở dạng phủ định.", "o": ["If you study hard, you will pass the test.", "If you study hard, you will passes the test.", "If you will study hard, you will pass the test."], "c3": 1}]}, {"id": "d30-VIII", "part": "VIII", "title": "Phần VIII", "instr": "Choose the correctly arranged sentence (A, B or C).", "type": "choice", "start": 46, "huong": "", "items": [{"s": "every Friday afternoon / our club / meets", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: Our.", "o": ["Our club meets every Friday afternoon.", "Our club every Friday afternoon meets.", "Meets our club every Friday afternoon."], "c3": 1}, {"s": "crazy about / Mai / collecting key rings / is", "a": 0, "u": 1, "hint": "Cấu trúc: S + be + tính từ + giới từ + V-ing. Câu bắt đầu bằng: Mai.", "o": ["Mai is crazy about collecting key rings.", "Mai crazy about is collecting key rings.", "Mai is collecting key rings crazy about."], "c3": 1}, {"s": "interesting / find / making models / I", "a": 0, "u": 1, "hint": "Thứ tự chung: S + V + O + nơi chốn + thời gian. Câu bắt đầu bằng: I.", "o": ["I find making models interesting.", "I making models find interesting.", "Find I making models interesting."], "c3": 1}, {"s": "puzzles / like / he / doesn't / doing", "a": 0, "u": 1, "hint": "Cấu trúc phủ định: S + doesn't/didn't + động từ nguyên mẫu + tân ngữ. Câu bắt đầu bằng: He.", "o": ["He doesn't like doing puzzles.", "He like doesn't doing puzzles.", "He doesn't doing like puzzles."], "c3": 1}, {"s": "now / chess / are / playing / they", "a": 0, "u": 1, "hint": "Thì hiện tại tiếp diễn: S + am/is/are + V-ing + tân ngữ + now. Câu bắt đầu bằng: They.", "o": ["They are playing chess now.", "They playing are chess now.", "They are chess playing now."], "c3": 1}]}]}];

}
function send(a, dung, tong) {

}

/* "Cach lam": cau dau hien san, phan con lai de trong muc Xem them */
function howHTML(h) {

/* Kiem tra DUNG MOT LAN cho ca bai: sai thi khoa + hien dap an; muon lam lai phai bam "Lam lai ca bai" */
function check(a, sec) {
  var n = a.items.length, k, fb = sec.querySelector('.fb');

    return;
  }
  var blank = [];
  for (k = 0; k < n; k++) if (evalItem(a, sec, k) === null) blank.push(a.start + a._ord.indexOf(k));

/* ---------- che do lam tung cau (de co goi y): bam la biet dung sai, sai thi goi y sua, lam den khi dung ---------- */
function LIVE(a) { return a.items.some(function (it) { return it.hint; }); }

  var el = ctl(sec, k); return (el.querySelector('.qb') || el.closest('.qb') || el.closest('.q') || el.parentNode);

function wordsOf(a, s) { var t = a.type === 'type' ? normSent(s) : norm(s); return t ? t.split(' ') : []; }
function diffMsg(wrong, right) {
  var tk = function (s) { return String(s).replace(/<[^>]+>/g, '').replace(/[.,?!]/g, '').split(/\s+/).filter(Boolean); };
  var w = tk(wrong), r = tk(right);
  if (w.length < 3 || r.length < 3) return '';
  var p = 0, s = 0;
  while (p < w.length && p < r.length && w[p].toLowerCase() === r[p].toLowerCase()) p++;
  while (s < w.length - p && s < r.length - p && w[w.length - 1 - s].toLowerCase() === r[r.length - 1 - s].toLowerCase()) s++;
  var ws = w.slice(p, w.length - s), rs = r.slice(p, r.length - s);
  if (!ws.length) return ' Phương án em chọn bị thiếu từ' + (p ? ' sau chữ "' + w[p - 1] + '"' : ' ở đầu câu') + '.';
  if (!rs.length) return ' Phương án em chọn bị thừa chữ "' + ws.join(' ') + '".';
  if (ws.length > 4) return ' Phương án em chọn sai về trật tự từ, bắt đầu từ chữ "' + ws[0] + '".';
  return ' Phương án em chọn sai ở chỗ "' + ws.join(' ') + '".';
}
function fixText(a, it, k, val, chosen) {
  var n = a._try[k] || 0, hint = it.hint ? ' Đọc lại gợi ý: ' + it.hint : '';
  if (a.type === 'choice' || a.type === 'pchoice') {
    var m = 'Chưa đúng, em chọn lại nhé.' + (chosen >= 0 ? diffMsg(it.o[chosen], it.o[it.a]) : '') + hint;
    if (n >= 2) m += ' Em đã loại được ' + n + ' phương án sai, chỉ còn ' + (it.o.length - n) + ' phương án.';
    return m;
  }
  var w = wordsOf(a, val), best = null, bp = -1;
  it.a.forEach(function (x) {
    var t = wordsOf(a, x), p = 0;
    while (p < t.length && p < w.length && t[p] === w[p]) p++;
    if (p > bp || (p === bp && p > 0 && best && Math.abs(t.length - w.length) < Math.abs(best.length - w.length))) { bp = p; best = t; }
  });
  var m = 'Chưa đúng. ';
  if (a.type === 'type') {
    if (bp > 0) m += 'Em viết đúng ' + bp + ' từ đầu (đến chữ "' + w[bp - 1] + '"), cần sửa từ thứ ' + (bp + 1) + ' trở đi. ';
    else m += 'Ngay từ đầu tiên đã chưa đúng, em xem lại cách bắt đầu câu. ';
    if (bp === w.length && w.length < best.length) m += 'Câu của em còn thiếu phần cuối. ';
    if (bp === best.length && w.length > best.length) m += 'Câu của em bị thừa từ ở cuối. ';
    m += it.hint ? 'Gợi ý: ' + it.hint : '';
    if (n >= 3 && bp < best.length) m += ' Gợi ý thêm: từ thứ ' + (bp + 1) + ' là "' + best[bp] + '".';
    return m;
  }

  var inBox = a.box && a.box.map(norm).indexOf(norm(it.a[0])) >= 0;
  if (inBox && a.box.map(norm).indexOf(got) < 0) m += 'Từ "' + val.trim() + '" không có trong khung, em chọn từ trong khung. ';
  else if (best.length !== w.length) m += 'Chỗ trống này cần ' + best.length + ' từ, em viết ' + w.length + ' từ. ';
  else if (got.slice(0, 3) === tgt.slice(0, 3)) m += 'Em gần đúng rồi: kiểm tra lại dạng của từ (đuôi -s, -es, -ed, -ing, -ly, -ful...) hoặc chính tả. ';
  m += it.hint ? 'Gợi ý: ' + it.hint : '';

function liveOrder(a) { return (a.passage ? idOrder(a.items.length) : a._ord); }

  }, 450);
}
function needName(sec) {

  fb.innerHTML = '<p><b>Em chưa nhập họ tên.</b> Em về trang chính, nhập họ tên và lớp rồi quay lại làm bài để điểm được ghi cho em.</p><p><a class="lnk" href="#home">Về trang chính</a></p>';

/* ---------- su kien ---------- */
var view = '';
