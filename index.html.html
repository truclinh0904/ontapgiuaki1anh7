<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Tiếng Anh 7 - Hoa Dũng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --ink:#16263F; --mute:#55657D; --line:#D9E1EC;
  --accent:#16406F; --accent-ink:#FFFFFF; --kite:#E9A524; --ok:#1B7F55; --ok-bg:#E2F4EB; --bad:#C23B2A; --bad-bg:#FBE8E5; --warn-bg:#FFF4DB; --sel:#DCE9F8;
  --head:'Be Vietnam Pro','Segoe UI',Arial,sans-serif; --body:'Nunito','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --card:#172236; --ink:#E7EEF8; --mute:#9FB0C7; --line:#2B3A52; --accent:#7DB2F0; --accent-ink:#0E1626; --kite:#F2BA4B;
  --ok:#5CD39B; --ok-bg:#133726; --bad:#FF8A78; --bad-bg:#3B1B18; --warn-bg:#3A2E10; --sel:#223A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --card:#172236; --ink:#E7EEF8; --mute:#9FB0C7; --line:#2B3A52; --accent:#7DB2F0; --accent-ink:#0E1626; --kite:#F2BA4B;
  --ok:#5CD39B; --ok-bg:#133726; --bad:#FF8A78; --bad-bg:#3B1B18; --warn-bg:#3A2E10; --sel:#223A5C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
#app{max-width:760px;margin-inline:auto}
h1,h2,h3,h4{font-family:var(--head);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.15rem;font-weight:600;margin-block:28px 12px} h3{font-size:1.02rem;font-weight:600}
p{margin:0 0 .6em}
a{color:var(--accent)}
.top{margin-bottom:8px}
.brand{font-family:var(--head);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sub{color:var(--mute);margin-top:6px}
.back{display:inline-block;margin-bottom:14px;font-weight:600;text-decoration:none}
.back::before{content:"\2190  "}
.who{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px 14px;margin-top:20px}
.who h2{margin-top:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row label{flex:1 1 200px;min-width:0;font-size:.85rem;font-weight:600;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:.85rem;color:var(--mute);margin:10px 0 0}
.grid,.grid3{display:grid;gap:12px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card b{font-family:var(--head);font-size:1.05rem}
.card span{font-size:.85rem;color:var(--mute)}
.card .mini{color:var(--accent);font-weight:700}
.gcard{border-top:4px solid var(--kite)}
.gl{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gc h3{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ic{flex:none;color:var(--accent)}
.gc p{font-size:.96rem}
.tip{background:var(--warn-bg);border-radius:8px;padding:8px 10px;margin-top:10px}
.tb{border-collapse:collapse;width:100%;font-size:.92rem;display:block;overflow-x:auto}
.tb td{border:1px solid var(--line);padding:5px 9px}
.pn{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pn a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-weight:600;font-size:.9rem}
.pn a.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{flex:none;min-width:44px;height:40px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 .95rem var(--head);cursor:pointer}
.tab.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.done::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}
.tab.cur.done::after{background:var(--kite)}
.act{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ah{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.instr{font-size:.88rem;color:var(--mute);font-style:italic;margin-top:4px}
.stars{display:flex;gap:2px}
.st{color:var(--line)} .st.on{color:var(--kite)} .st .ic{color:inherit;fill:currentColor}
.box{list-style:none;padding:10px 12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg);border:1px dashed var(--mute);border-radius:8px}
.box li{font-weight:700;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.ql{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:14px}
.q{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:start}
.no{font-family:var(--head);font-weight:700;color:var(--accent)}
.qs{margin:0 0 6px;overflow-wrap:anywhere}
.stub{font-size:.88rem;color:var(--mute);margin:0 0 6px}
.un{font-size:.72rem;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap}
.unrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bk{display:inline-block;width:3.2em;border-bottom:2px solid var(--mute);margin-inline:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{display:flex;gap:8px;align-items:baseline;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt b{color:var(--accent)}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.q.ok .opt.sel{background:var(--ok-bg);border-color:var(--ok)}
.q.bad .opt.sel{background:var(--bad-bg);border-color:var(--bad)}
.opt.key{background:var(--ok-bg);border-color:var(--ok)}
.opt.key b{color:var(--ok)}
.ans{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:.92rem}
.ty + .ans{display:block;margin:6px 0 0;width:fit-content}
.more{margin-top:4px}
.more summary{cursor:pointer;color:var(--accent);font-weight:600}
.more p{margin:6px 0 0}
.fb.stop{background:var(--warn-bg)}
.rule{font-size:.85rem;color:var(--mute);margin:12px 0 0}
.gp{width:9.5em;max-width:100%;display:inline-block;padding:4px 8px}
.ty{width:100%;resize:vertical}
input.ok,textarea.ok,select.ok{border-color:var(--ok);background:var(--ok-bg)}
input.bad,textarea.bad,select.bad{border-color:var(--bad);background:var(--bad-bg)}
.pass{margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:8px;line-height:2.2}
.pass h4{font-size:1rem;margin-bottom:6px}
.pass p{margin:0}
.pb{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pb i{font-style:normal;font-size:.75rem;font-weight:700;color:var(--accent)}
.sl{padding:4px 6px;max-width:100%}
.fb{margin-top:16px;border-radius:8px;padding:10px 14px}
.fb p{margin:0 0 6px}
.fb.warn{background:var(--warn-bg)} .fb.good{background:var(--ok-bg)}
.how{font-size:.94rem}
.bt{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{font:600 .95rem var(--head);padding:10px 18px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lnk{font-weight:700}
@media (max-width:520px){h1{font-size:1.55rem}.q{grid-template-columns:26px minmax(0,1fr)}.q .un{grid-column:2;justify-self:start}}
@media (prefers-reduced-motion:no-preference){.card,.btn,.tab{transition:border-color .15s,background .15s}}
</style>
</head>

<script>
(function(){
window.GRAMMAR = [
  {

    cards: [
      {
        h: "1. Phát âm nguyên âm /ə/ và /ɜː/",
        icon: "sound",
        body: [
          "<b>Âm /ə/ ( nguyên âm ngắn, nhẹ ):</b> thường gặp ở các âm tiết không nhấn trọng âm như <b><u>a</u></b>go, <b><u>a</u></b>bout, <b><u>a</u></b>mazing, <b><u>a</u></b>bove, <b><u>a</u></b>way, <b><u>a</u></b>lone, <b><u>a</u></b>rrange, <b><u>a</u></b>ffect, <b><u>a</u></b>llergy, <b><u>o</u></b>pinion, <b><u>o</u></b>fficial, <b><u>o</u></b>blige, <b><u>o</u></b>rigin, yog<b><u>a</u></b>, sof<b><u>a</u></b>, camer<b><u>a</u></b>, cinem<b><u>a</u></b>, banan<b><u>a</u></b>,umbrell<b><u>a</u></b>, col<b><u>o</u></b>r, neighb<b><u>ou</u></b>r, doct<b><u>o</u></b>r, teach<b><u>er</u></b>, fath<b><u>er</u></b>, moth<b><u>er</u></b>, sist<b><u>er</u></b>, broth<b><u>er</u></b>, <b><u>u</u></b>pon, s<b><u>u</u></b>pply, s<b><u>u</u></b>pport, c<b><u>o</u></b>llect, c<b><u>o</u></b>mputer.",

      {

      {

      {
        h: "4. Động từ chỉ sự yêu thích (Verbs of liking and disliking)",

        body: [

    ]
  },
  {
    id: "u2",

    t = t.replace('{' + (k + 1) + '}', ctl);
  });
  return '<div class="pass">' + (a.ptitle ? '<h4>' + esc(a.ptitle) + '</h4>' : '') + '<p>' + t + '</p></div>' +
    '<p class="unrow">' + a.items.map(function (it, k) { return '<span class="un">' + (a.start + k) + ': Unit ' + it.u + '</span>'; }).join('') + '</p>';
}
function actHTML(a) {
  a._opt = {};
  a._ord = a.passage ? idOrder(a.items.length) : shuffled(a.items.length);
  var h = '<section class="act" data-act="' + a.id + '"><div class="ah"><div><h3>' + esc(a.title) + '</h3><p class="instr">' + esc(a.instr) + '</p></div><div class="stars" aria-label="Sao">' + stars(a.id) + '</div></div>';
  if (a.box) h += '<ul class="box" aria-label="Khung từ">' + shuffled(a.box.length).map(function (i) { return '<li>' + esc(a.box[i]) + '</li>'; }).join('') + '</ul>';
  if (a.passage) h += passHTML(a);
  else h += '<ol class="ql">' + a._ord.map(function (k, pos) { return itemHTML(a, a.items[k], k, pos); }).join('') + '</ol>';
  h += '<p class="rule">Em làm hết các câu rồi bấm Kiểm tra. Câu sai sẽ hiện đáp án đúng. Muốn làm lại, em phải làm lại cả bài từ đầu.</p>';
  h += '<div class="fb" hidden></div><div class="bt"><button type="button" class="btn pri" data-do="check">Kiểm tra</button><button type="button" class="btn" data-do="reset">Làm lại cả bài</button></div></section>';
  return h;
}

function homeView() {
  var h = '<header class="top"><p class="brand">Dịch vụ gia sư và dạy kèm Hoa Dũng</p><h1>Ôn tập Tiếng Anh 7</h1><p class="sub">Ôn tập giữa học kì I · Unit 1, 2, 3 · 10 đề, mỗi đề 50 câu</p></header>';
  h += '<section class="who"><h2>Thông tin của em</h2><div class="row"><label for="ten">Họ và tên<input id="ten" type="text" value="' + esc(me.ten) + '" autocomplete="name"></label><label for="lop">Lớp<input id="lop" type="text" value="' + esc(me.lop) + '" autocomplete="off"></label></div>' +
    '<p class="note">Kết quả mỗi lần kiểm tra được gửi về cho thầy' + (WEB ? '' : ' khi thầy kết nối Google Sheets') + '. Làm đúng hết cả phần là Hoàn thành; còn câu sai là Chưa hoàn thành, em làm lại cả phần để hoàn thành.</p></section>';
  h += '<section><h2>Bảng ngữ pháp</h2><div class="grid3">' + GR.map(function (g) { return '<a class="card gcard" href="#' + g.id + '"><b>' + g.title + '</b><span>' + esc(g.topic) + '</span></a>'; }).join('') + '</div></section>';
  h += '<section><h2>Đề ôn tập</h2><div class="grid">' + DES.map(function (d) {
    var s = deStat(d);
    return '<a class="card dcard" href="#' + d.id + '"><b>' + d.title + '</b><span>' + s.done + '/9 phần đúng hết</span><span class="mini">' + s.st + '/27 sao</span></a>';
  }).join('') + '</div></section>';
  return h;
}
function grammarView(g) {
  var h = '<a class="back" href="#home">Về trang chính</a><header class="top"><p class="brand">Bảng ngữ pháp</p><h1>' + g.title + '</h1><p class="sub">' + esc(g.topic) + '</p></header><div class="gl">';
  g.cards.forEach(function (c) {
    h += '<article class="gc"><h3>' + icon(c.icon) + '<span>' + esc(c.h) + '</span></h3>' + c.body.map(function (b) { return '<p>' + b + '</p>'; }).join('') + (c.tip ? '<p class="tip"><b>Mẹo:</b> ' + esc(c.tip) + '</p>' : '') + '</article>';
  });
  h += '</div><nav class="pn">' + GR.map(function (x) { return '<a class="' + (x.id === g.id ? 'cur' : '') + '" href="#' + x.id + '">' + x.title + '</a>'; }).join('') + '<a href="#home">Đề ôn tập</a></nav>';
  return h;
}
function deView(d) {
  var t = curTab[d.id] || 0;
  var h = '<a class="back" href="#home">Về trang chính</a><header class="top"><p class="brand">Ôn tập giữa học kì I · Tiếng Anh 7</p><h1>' + d.title + '</h1></header><nav class="tabs" role="tablist">' +
    d.acts.map(function (a, i) {
      var p = prog[a.id], ok = p && p.best >= p.total;
      return '<button type="button" role="tab" class="tab' + (i === t ? ' cur' : '') + (ok ? ' done' : '') + '" data-tab="' + i + '" aria-selected="' + (i === t) + '">' + a.part + '</button>';
    }).join('') + '</nav><div id="actbox">' + actHTML(d.acts[t]) + '</div>';
  return h;
}

function findAct(id) {
  for (var i = 0; i < DES.length; i++) for (var j = 0; j < DES[i].acts.length; j++) if (DES[i].acts[j].id === id) return DES[i].acts[j];
}
function ctl(sec, k) { return sec.querySelector('[data-q="' + k + '"]'); }
function evalItem(a, sec, k) {
  var it = a.items[k], el = ctl(sec, k);
  if (a.type === 'choice') { var s = el.getAttribute('data-sel'); if (s === null || s === '') return null; return +s === it.a; }
  if (a.type === 'pchoice') { if (el.value === '') return null; return +el.value === it.a; }
  var v = el.value.trim(); if (!v) return null;
  return match(a, it, v);
}
function lockOK(a, sec, k) {
  var el = ctl(sec, k);
  if (a.type === 'choice') { el.classList.add('ok'); el.classList.remove('bad'); el.querySelectorAll('.opt').forEach(function (b) { b.disabled = true; }); }
  else { el.classList.add('ok'); el.classList.remove('bad'); if (el.tagName === 'SELECT') el.disabled = true; else el.readOnly = true; }
}
function insAns(el, text) { if (el.parentNode.querySelector('.ans')) return; var s = document.createElement('span'); s.className = 'ans'; s.textContent = 'Đáp án: ' + text; el.insertAdjacentElement('afterend', s); }
function lockWrong(a, sec, k) {
  var el = ctl(sec, k), it = a.items[k];
  if (a.type === 'choice') {
    el.classList.add('bad');
    el.querySelectorAll('.opt').forEach(function (b) { if (+b.getAttribute('data-o') === it.a) b.classList.add('key'); b.disabled = true; });
  } else if (a.type === 'pchoice') {
    var op = el.querySelector('option[value="' + it.a + '"]'); el.classList.add('bad'); el.disabled = true; insAns(el, op ? op.textContent : String(it.o[it.a]));
  } else {
    el.classList.add('bad'); if (el.tagName === 'SELECT') el.disabled = true; else el.readOnly = true; insAns(el, it.a[0]);
  }
}
function send(a, dung, tong) {
  if (!WEB) return;
  var p = new URLSearchParams({ ten: me.ten, lop: me.lop, unit: a.id.split('-')[0].replace('d', 'De '), bai: a.id, tieude: a.title, dung: dung, tong: tong, diem: (Math.round(dung / tong * 100) / 10).toFixed(1), sao: (dung / tong >= 1 ? 3 : dung / tong >= 0.9 ? 2 : dung / tong >= 0.8 ? 1 : 0) });
  var url = WEB + (WEB.indexOf('?') < 0 ? '?' : '&') + p.toString();
  try { fetch(url, { mode: 'no-cors' }).catch(function () { showSend(a, url); }); } catch (e) { showSend(a, url); }
}
function showSend(a, url) {
  var sec = root.querySelector('[data-act="' + a.id + '"]'); if (!sec) return;
  var fb = sec.querySelector('.fb'); fb.insertAdjacentHTML('beforeend', '<p><a class="lnk" target="_blank" rel="noopener" href="' + esc(url) + '">Gửi điểm cho thầy</a></p>');
}
function howHTML(h) {
  var s = String(h || '').trim(); if (!s) return '';
  var i = s.search(/[.!?]\s/), first = i < 0 ? s : s.slice(0, i + 1), rest = i < 0 ? '' : s.slice(i + 1).trim();
  return '<p class="how"><b>Cách làm:</b> ' + esc(first) + '</p>' +
    (rest ? '<details class="more"><summary>Xem thêm</summary><p class="how">' + esc(rest) + '</p></details>' : '');
}
function check(a, sec) {
  var n = a.items.length, k, fb = sec.querySelector('.fb');
  if (!String(me.ten || '').trim()) {
    fb.hidden = false; fb.className = 'fb stop';
    fb.innerHTML = '<p><b>Em chưa nhập họ tên.</b> Em về trang chính, nhập họ tên và lớp rồi quay lại làm bài để điểm được ghi cho em.</p><p><a class="lnk" href="#home">Về trang chính</a></p>';
    return;
  }
  var blank = [];
  for (k = 0; k < n; k++) if (evalItem(a, sec, k) === null) blank.push(a.start + a._ord.indexOf(k));
  blank.sort(function (x, y) { return x - y; });
  if (blank.length) {
    fb.hidden = false; fb.className = 'fb stop';
    fb.innerHTML = '<p><b>Em chưa làm xong.</b> Còn ' + blank.length + ' câu chưa trả lời (câu ' + blank.join(', ') + '). Em làm hết rồi mới bấm Kiểm tra.</p>';
    return;
  }
  var dung = 0, wrong = 0;
  for (k = 0; k < n; k++) {
    if (evalItem(a, sec, k) === true) { dung++; lockOK(a, sec, k); } else { wrong++; lockWrong(a, sec, k); }
  }
  var p = prog[a.id] || (prog[a.id] = { first: dung, total: n, best: dung, lan: 0 });
  p.total = n; p.lan = (p.lan || 0) + 1; p.last = dung; if (dung > p.best) p.best = dung;
  ls('hd_prog', prog);
  send(a, dung, n);
  fb.hidden = false;
  if (wrong === 0) {
    fb.className = 'fb good';
    fb.innerHTML = '<p><b>Em đã làm đúng hết ' + n + ' câu.</b> Phần này được ghi nhận là <b>Hoàn thành</b>.</p><p>Em có thể bấm Làm lại cả bài để luyện thêm.</p>';
  } else {
    fb.className = 'fb warn';
    fb.innerHTML = '<p>Em đúng <b>' + dung + '/' + n + '</b> câu. Phần này được ghi nhận là <b>Chưa hoàn thành</b>.</p>' +
      '<p>Các câu sai đã được khóa và hiện đáp án đúng. Em đọc đáp án và làm theo cách làm dưới đây để hiểu vì sao chọn như vậy.</p>' + howHTML(a.huong) +
      '<p>Muốn hoàn thành, em bấm Làm lại cả bài và làm lại từ câu đầu tiên.</p>';
  }
  sec.querySelector('[data-do="check"]').hidden = true;
  sec.querySelector('.stars').innerHTML = stars(a.id);
  var tab = root.querySelector('.tab.cur'); if (tab && prog[a.id] && prog[a.id].best >= prog[a.id].total) tab.classList.add('done');
}

var view = '';
function route() {
  var h = (location.hash || '#home').slice(1) || 'home', html = '';
  var g = GR.filter(function (x) { return x.id === h; })[0], d = DES.filter(function (x) { return x.id === h; })[0];
  if (g) { html = grammarView(g); } else if (d) { html = deView(d); } else { h = 'home'; html = homeView(); }
  view = h; root.innerHTML = html; window.scrollTo(0, 0);
}
root.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t) return;
  var sec = t.closest('.act');
  if (t.classList.contains('opt')) {
    var q = t.closest('.q'); if (t.disabled) return;
    q.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('sel'); }); t.classList.add('sel');
    q.setAttribute('data-sel', t.getAttribute('data-o')); q.classList.remove('bad'); return;
  }
  if (t.hasAttribute('data-tab')) {
    var dd = DES.filter(function (x) { return x.id === view; })[0]; if (!dd) return;
    curTab[dd.id] = +t.getAttribute('data-tab'); root.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('cur'); b.setAttribute('aria-selected', 'false'); });
    t.classList.add('cur'); t.setAttribute('aria-selected', 'true');
    document.getElementById('actbox').innerHTML = actHTML(dd.acts[curTab[dd.id]]); return;
  }
  if (!sec) return;
  var a = findAct(sec.getAttribute('data-act'));
  if (t.getAttribute('data-do') === 'check') check(a, sec);
  if (t.getAttribute('data-do') === 'reset') { mem[a.id] = {}; sec.outerHTML = actHTML(a); }
});
root.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'ten' || el.id === 'lop') { me.ten = (document.getElementById('ten') || {}).value || ''; me.lop = (document.getElementById('lop') || {}).value || ''; ls('hd_me', me); return; }
  if (el.classList && el.hasAttribute('data-q')) el.classList.remove('bad');
});
root.addEventListener('change', function (e) { var el = e.target; if (el.tagName === 'SELECT') el.classList.remove('bad'); });
window.addEventListener('hashchange', route);
route();
window.__hd = { DES: DES, norm: norm, match: match };
})();
</script>
</body>
</html>
